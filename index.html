<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>実験の日程調整</title>
<style>
  /* form-style look: lavender page, white question cards, underlined inputs, purple accent */
  :root {
    --bg: #f0ebf8; --card: #ffffff; --text: #202124; --muted: #5f6368; --line: #dadce0;
    --accent: #673ab7; --accent-weak: #ede7f6; --accent-line: #d1c4e9;
    --ok: #188038; --warn: #b06000; --warn-weak: #fef7e0; --err: #d93025; --err-weak: #fce8e6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: Roboto, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", -apple-system, sans-serif;
    font-size: 16px; line-height: 1.6; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 12px 32px; }
  h1 { font-size: 1.75rem; font-weight: 400; line-height: 1.35; margin: 0 0 8px; }
  h2 { font-size: 1rem; font-weight: 500; margin: 0 0 10px; }
  .meta { color: var(--text); font-size: .9rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 22px 24px; margin-bottom: 12px; }
  .form-head { border-top: 10px solid var(--accent); padding-top: 20px; }
  .req-note { color: var(--err); font-size: .85rem; margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
  .q-title { display: block; font-size: 1rem; font-weight: 500; margin: 0 0 14px; }
  .req { color: var(--err); }
  .q-help { color: var(--muted); font-size: .85rem; margin: -8px 0 12px; }
  label { display: block; font-weight: 500; margin: 0 0 4px; }
  input[type=text], input[type=email], input[type=number], select {
    width: 100%; font-size: 16px; padding: 6px 0 5px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
    background: transparent; color: var(--text); outline: none; }
  input[type=text]:focus, input[type=email]:focus, input[type=number]:focus, select:focus { border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
  input::placeholder { color: #9aa0a6; }
  select { border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
  .check { display: flex; gap: 12px; align-items: flex-start; font-weight: 400; margin: 0; }
  .check input { width: 20px; height: 20px; margin-top: 3px; flex: none; accent-color: var(--accent); }
  button { font-size: .95rem; padding: 9px 24px; min-height: 40px; border-radius: 4px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; font-weight: 500; letter-spacing: .02em; cursor: pointer; }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button.sub { background: #fff; color: var(--accent); border-color: var(--line); }
  button.danger { background: #fff; color: var(--err); border-color: var(--line); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .submit-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
  .sending { color: var(--accent); font-size: .9rem; }
  .submit-area { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 4px 0 16px; }
  #submitBtn:disabled { background: #b39ddb; border-color: #b39ddb; opacity: .55; }
  .day { margin-top: 14px; }
  .day-title { font-weight: 500; font-size: .95rem; border-bottom: 1px solid var(--line); padding-bottom: 2px; margin-bottom: 8px; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .slot { background: #fff; color: var(--text); border: 1px solid var(--line); font-weight: 400; padding: 9px 8px; text-align: center; }
  .slot.on { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); font-weight: 500; }
  .slot small { display: block; color: var(--muted); font-weight: 400; font-size: .78rem; }
  .chosen { background: var(--accent-weak); border-radius: 4px; padding: 8px 12px; margin: 6px 0; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .chosen button { padding: 2px 12px; min-height: 30px; font-size: .85rem; white-space: nowrap; flex: none; }
  .note { color: var(--muted); font-size: .9rem; }
  .msg { border-radius: 8px; padding: 12px 14px; margin: 12px 0; white-space: pre-wrap; }
  .msg.err { background: var(--err-weak); color: var(--err); }
  .msg.warn { background: var(--warn-weak); color: var(--warn); }
  .msg.ok { background: #e6f4ea; color: var(--ok); }
  .done-title { font-size: 1.15rem; font-weight: 500; margin: 0 0 8px; }
  .plan-item { border-bottom: 1px solid var(--line); padding: 8px 0; }
  .plan-item .ng { color: var(--warn); font-weight: 700; }
  .badge { display: inline-block; font-size: .8rem; border-radius: 999px; padding: 0 8px; border: 1px solid var(--line); color: var(--muted); }
  .badge.rebook { border-color: var(--warn); color: var(--warn); }
  .ask { background: var(--warn-weak); border: 1px solid #f9d46c; border-radius: 8px; padding: 12px 14px; margin: 10px 0; }
  .ask p { margin: 0; font-weight: 500; }
  .tabs { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
  .tabs button { flex: 1; background: transparent; color: var(--muted); border: 0; border-bottom: 3px solid transparent; border-radius: 0;
    padding: 10px 6px; min-height: 46px; font-weight: 500; font-size: .9rem; }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs button:hover:not(.on) { background: #f8f9fa; filter: none; }
  .page-foot { text-align: center; color: var(--muted); font-size: .78rem; margin-top: 18px; }
  /* calendar picker (Picker.html) */
  .cal { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #fff; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-title { font-weight: 700; font-size: 1.05rem; }
  .cal-nav { background: #fff; color: var(--accent); border: 1px solid var(--line); width: 44px; height: 40px; min-height: 0; padding: 0; font-size: 1.4rem; line-height: 1; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-wd { text-align: center; font-size: .8rem; color: var(--muted); padding: 2px 0; }
  .cal-wd.sun, .cal-day.sun .cal-num { color: #c62828; }
  .cal-wd.sat, .cal-day.sat .cal-num { color: #1565c0; }
  .cal-day { min-height: 54px; border-radius: 6px; font-size: inherit; letter-spacing: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 4px 0; font-weight: 500; border: 1px solid transparent; background: transparent; color: var(--text); }
  .cal-day.off { opacity: .35; }
  .cal-day.blank { visibility: hidden; }
  .cal-day.open { background: var(--accent-weak); border-color: var(--accent-line); cursor: pointer; }
  .cal-day.open .cal-num { font-weight: 700; }
  .cal-day.sel { background: var(--accent); border-color: var(--accent); }
  .cal-day.sel .cal-num, .cal-day.sel .cal-cnt { color: #fff; }
  .cal-day.has-on:not(.sel) { border: 2px solid var(--accent); }
  .cal-num { font-size: 1rem; line-height: 1.2; }
  .cal-cnt { font-size: .68rem; color: var(--accent); line-height: 1.2; }
  .cal-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 8px; font-size: .78rem; color: var(--muted); }
  .cal-legend .lg { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--accent-line); background: var(--accent-weak); }
  .cal-legend .lg.sel { background: var(--accent); border-color: var(--accent); margin-left: 6px; }
  .cal-times { margin-top: 14px; }
  /* ★おすすめ: next to a booked session (first-come). Star + text, never colour alone */
  .slot.near { border: 2px solid var(--warn); }
  .slot.near.on { border-color: var(--accent); }
  .slot small.near-tag { color: var(--warn); font-weight: 700; }
  .cal-day.near:not(.sel) .cal-cnt { color: var(--warn); font-weight: 700; }
  .cal-legend .lg-star { color: var(--warn); font-weight: 700; margin-left: 6px; }
  /* what taking part brings (booking page) */
  .benefits { border-left: 6px solid var(--ok); }
  .benefits h2 { margin: 0 0 8px; font-size: 1.05rem; }
  .benefits p { margin: 4px 0; }
  .benefits .benefit-item { padding-left: 1.1em; text-indent: -1.1em; }
  .benefits .benefit-item::before { content: '✓ '; color: var(--ok); font-weight: 700; }
  /* results (manage page) */
  .results { margin: 14px 0; }
  .res-item { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 10px 0; break-inside: avoid; }
  .res-name { font-weight: 700; }
  .res-value { font-size: 1.4rem; font-weight: 700; color: var(--accent); margin: 2px 0 6px; }
  .res-change { font-size: .9rem; color: var(--text); font-weight: 400; margin-left: 6px; }
  .res-hist { border-collapse: collapse; font-size: .85rem; margin: 4px 0 6px; }
  .res-hist th, .res-hist td { border: 1px solid var(--line); padding: 3px 8px; text-align: center; }
  .res-desc, .res-use { font-size: .9rem; margin: 4px 0; }
  .print-btn { margin-left: 8px; padding: 4px 12px; min-height: 0; }
  @media print {
    body { background: #fff; }
    .row, #picker, .print-btn, .page-foot, #info, #error { display: none !important; }
    .card { border: 0; padding: 0; }
  }
  /* honeypot: kept out of sight and out of the tab order */
  .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  details.wl { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 10px; }
  details.wl summary { cursor: pointer; color: var(--accent); font-weight: 500; }
  details.wl .slot small { color: var(--muted); }
  #emailHint .msg { margin-top: 8px; }
  .near-note { background: var(--warn-weak); color: var(--text); border-radius: 6px; padding: 8px 10px; font-size: .88rem; margin: 0 0 10px; }
  .cal-times .day-title { font-size: 1rem; }
  @media (max-width: 420px) { .cal { padding: 8px 6px; } .cal-grid { gap: 3px; } .cal-day { min-height: 48px; } .cal-cnt { font-size: .62rem; } }
  /* overall status (no names) */
  .st-sum { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .95rem; }
  .st-sum b { font-size: 1.15rem; color: var(--accent); }
  .st-day { margin-top: 12px; }
  .st-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .st-item { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 7px 10px;
    border-radius: 4px; border: 1px solid var(--line); font-size: .9rem; background: #fff; }
  .st-tag { font-size: .78rem; font-weight: 700; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .st-open .st-tag { color: var(--ok); background: #e9f6ec; }
  .st-full { background: #f1f3f4; }
  .st-full .st-tag { color: #fff; background: #5f6368; }
  .st-closed { opacity: .6; }
  .st-closed .st-tag { color: var(--muted); background: #f0f0f0; }
  .st-closed.st-has { opacity: 1; }
  @media (max-width: 420px) { .st-grid { grid-template-columns: repeat(2, 1fr); } .st-item { flex-direction: column; align-items: flex-start; gap: 2px; } }
  .name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  label.sub-label { font-weight: 400; font-size: .8rem; color: var(--muted); margin: 0; }
  .name-row + .name-row { margin-top: 14px; }
  .hidden { display: none; }
  /* honorarium form: search results, picked bank / branch, station chips, radio rows */
  .opt-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .opt { text-align: left; background: #fff; color: var(--text); border: 1px solid var(--line); font-weight: 400; padding: 8px 12px; }
  .opt small, .chip small { display: block; color: var(--muted); font-size: .78rem; }
  .picked { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--accent-weak); border-radius: 4px; padding: 8px 12px; margin-top: 6px; }
  .picked button { padding: 2px 12px; min-height: 30px; font-size: .85rem; flex: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
  .chip { background: #fff; color: var(--text); border: 1px solid var(--line); font-weight: 500; padding: 6px 12px; text-align: left; }
  .chip.on { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); }
  .radio-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .radio-row input[type=radio] { width: 20px; height: 20px; margin-top: 3px; flex: none; accent-color: var(--accent); }
  input[type=date], input[type=tel] { width: 100%; font-size: 16px; padding: 6px 0 5px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--text); outline: none; }
  input[type=file] { font-size: .9rem; }
  .ok-text { color: var(--ok); font-weight: 500; }
  .spinner { color: var(--muted); padding: 12px 0; }
  a { color: var(--accent); }
  @media (max-width: 420px) { main { padding: 8px 8px 24px; } .card { padding: 18px 16px; } h1 { font-size: 1.45rem; } .slots { grid-template-columns: repeat(2, 1fr); } }
</style>
<script>
/**
 * Calendar-style slot picker shared by the booking and manage pages.
 * Month grid: days with open slots are highlighted with their count; tapping a day
 * lists that day's times underneath. Self-contained (no helpers from the pages).
 *
 * SlotPicker.render(container, slots, {
 *   isOn(slot) -> bool,          // highlighted times (selected / multi-select)
 *   onTap(slot),                 // time tapped
 *   state: {},                   // pass the same object across re-renders to keep month/day
 *   emptyText: '...',
 *   sub(slot) -> text,           // optional small line under a time (e.g. the examiner page)
 *   legend: '...',               // optional legend text for the highlighted days
 *   timesLabel: '...'            // optional heading after the day name (default 'の空き時間')
 * })
 * slots: [{id, date:'yyyy-MM-dd', startMin, endMin, remaining|null, near}]
 *   near = next to a booked session (first-come): marked ★おすすめ, and the first such day opens first
 */
var SlotPicker = (function () {
  var WD = ['日', '月', '火', '水', '木', '金', '土'];

  function h(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hm(m) { return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function key(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function parts(k) { var p = k.split('-'); return { y: +p[0], m: +p[1] - 1, d: +p[2] }; }
  function dayLabel(k) {
    var p = parts(k), wd = new Date(p.y, p.m, p.d).getDay();
    return (p.m + 1) + '月' + p.d + '日（' + WD[wd] + '）';
  }

  function render(container, slots, opts) {
    opts = opts || {};
    var st = opts.state || (container._pickerState = container._pickerState || {});
    var byDay = {};
    slots.forEach(function (s) { (byDay[s.date] = byDay[s.date] || []).push(s); });
    var days = Object.keys(byDay).sort();
    if (!days.length) {
      container.innerHTML = '<p class="msg warn">' + h(opts.emptyText ||
        '選べる日時がありません。条件に合う日時が埋まっているか、締め切られました。') + '</p>';
      return;
    }
    var nearDays = days.filter(function (k) { return byDay[k].some(function (s) { return s.near; }); });
    // keep the chosen day if still available; else the day of a selected time; else the first
    // day with a recommended time; else the first open day
    if (!st.day || !byDay[st.day]) {
      var on = slots.filter(function (s) { return opts.isOn && opts.isOn(s); })[0];
      st.day = on ? on.date : (nearDays[0] || days[0]);
    }
    if (st.month == null) { var p0 = parts(st.day); st.year = p0.y; st.month = p0.m; }
    var first = parts(days[0]), last = parts(days[days.length - 1]);
    var minIdx = first.y * 12 + first.m, maxIdx = last.y * 12 + last.m;
    var curIdx = Math.min(Math.max(st.year * 12 + st.month, minIdx), maxIdx);
    st.year = Math.floor(curIdx / 12); st.month = curIdx % 12;

    var html = '<div class="cal" role="group" aria-label="日付を選ぶ">' +
      '<div class="cal-head">' +
      '<button type="button" class="cal-nav" data-nav="-1" aria-label="前の月"' + (curIdx <= minIdx ? ' disabled' : '') + '>‹</button>' +
      '<div class="cal-title">' + st.year + '年' + (st.month + 1) + '月</div>' +
      '<button type="button" class="cal-nav" data-nav="1" aria-label="次の月"' + (curIdx >= maxIdx ? ' disabled' : '') + '>›</button>' +
      '</div><div class="cal-grid">';
    WD.forEach(function (w, i) { html += '<div class="cal-wd' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') + '">' + w + '</div>'; });
    var lead = new Date(st.year, st.month, 1).getDay();
    var n = new Date(st.year, st.month + 1, 0).getDate();
    var cells = [];
    for (var b = 0; b < lead; b++) cells.push({ html: '<div class="cal-day blank"></div>', open: false });
    for (var d = 1; d <= n; d++) {
      var k = key(st.year, st.month, d);
      var list = byDay[k] || [];
      var wd = (lead + d - 1) % 7;
      var cls = 'cal-day' + (wd === 0 ? ' sun' : wd === 6 ? ' sat' : '');
      if (!list.length) { cells.push({ html: '<div class="' + cls + ' off" aria-hidden="true"><span class="cal-num">' + d + '</span></div>', open: false }); continue; }
      var picked = list.filter(function (s) { return opts.isOn && opts.isOn(s); }).length;
      var near = nearDays.indexOf(k) >= 0;
      cls += ' open' + (k === st.day ? ' sel' : '') + (picked ? ' has-on' : '') + (near ? ' near' : '');
      cells.push({ open: true, html: '<button type="button" class="' + cls + '" data-day="' + k + '" aria-pressed="' + (k === st.day) + '" aria-label="' +
        h(dayLabel(k) + ' 空き' + list.length + '枠' + (near ? '・おすすめあり' : '') + (picked ? '・選択' + picked : '')) + '">' +
        '<span class="cal-num">' + d + '</span><span class="cal-cnt">' + (picked ? '✓' + picked : (near ? '★' : '') + list.length + '枠') + '</span></button>' });
    }
    // weeks before the first / after the last open day are dropped so the times stay near the top on phones
    var rows = [];
    for (var r = 0; r < cells.length; r += 7) rows.push(cells.slice(r, r + 7));
    var hasOpen = function (row) { return row.some(function (c) { return c.open; }); };
    var firstOpen = 0, lastOpen = rows.length - 1;
    while (firstOpen < lastOpen && !hasOpen(rows[firstOpen])) firstOpen++;
    while (lastOpen > firstOpen && !hasOpen(rows[lastOpen])) lastOpen--;
    rows.slice(firstOpen, lastOpen + 1).forEach(function (row) { row.forEach(function (c) { html += c.html; }); });
    html += '</div><div class="cal-legend"><span class="lg open"></span>' + h(opts.legend || '予約できる日（数字は空き枠）') + '<span class="lg sel"></span>表示中の日' +
      (nearDays.length ? '<span class="lg-star">★</span>おすすめの時間がある日' : '') + '</div></div>';

    var times = byDay[st.day] || [];
    var dayNear = times.some(function (s) { return s.near; });
    html += '<div class="cal-times"><div class="day-title">' + h(dayLabel(st.day)) + ' ' + h(opts.timesLabel || 'の空き時間') + '</div>' +
      (dayNear ? '<p class="near-note">★おすすめ＝ほかの方の予約の直前・直後の時間です。ご都合が合えば、こちらを優先して選んでいただけると助かります（実験機材の準備・片付けをまとめられるため）。</p>' : '') +
      '<div class="slots">' +
      times.map(function (s) {
        var on = opts.isOn && opts.isOn(s);
        return '<button type="button" class="slot' + (on ? ' on' : '') + (s.near ? ' near' : '') + '" data-id="' + h(s.id) + '" aria-pressed="' + !!on + '">' +
          (on ? '✓ ' : '') + hm(s.startMin) + '〜' + hm(s.endMin) + (s.near ? '<small class="near-tag">★おすすめ</small>' : '') +
          (s.remaining != null ? '<small>残り' + s.remaining + '</small>' : '') +
          (opts.sub && opts.sub(s) ? '<small>' + h(opts.sub(s)) + '</small>' : '') + '</button>';
      }).join('') + '</div></div>';
    container.innerHTML = html;

    Array.prototype.forEach.call(container.querySelectorAll('.cal-nav'), function (btn) {
      btn.onclick = function () {
        var idx = st.year * 12 + st.month + Number(btn.getAttribute('data-nav'));
        st.year = Math.floor(idx / 12); st.month = idx % 12;
        // jump the shown day to the first open day of the new month
        var pre = key(st.year, st.month, 1).slice(0, 8);
        var inMonth = days.filter(function (x) { return x.slice(0, 8) === pre; });
        if (inMonth.length) st.day = inMonth[0];
        render(container, slots, Object.assign({}, opts, { state: st }));
      };
    });
    Array.prototype.forEach.call(container.querySelectorAll('.cal-day.open'), function (btn) {
      btn.onclick = function () {
        st.day = btn.getAttribute('data-day');
        render(container, slots, Object.assign({}, opts, { state: st }));
        var t = container.querySelector('.cal-times');
        if (t && t.scrollIntoView) t.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      };
    });
    Array.prototype.forEach.call(container.querySelectorAll('.cal-times .slot'), function (btn) {
      btn.onclick = function () {
        var s = times.filter(function (x) { return x.id === btn.getAttribute('data-id'); })[0];

n  var m = [];\n  if (HON_TOKEN) return honorMissing();\n  if (!$('familyName').value.trim() || !$('givenName').value.trim()) m.push('お名前');\n  var kana = toHiragana($('familyKana').value) + toHiragana($('givenKana').value);\n  if (!toHiragana($('familyKana').value) || !toHiragana($('givenKana').value) || !/^[ぁ-ゖー]+$/.test(kana)) m.push('ふりがな（ひらがな）');\n  if (!emailOk($('email').value)) m.push('メールアドレス');\n  else if (!emailSame()) m.push('メールアドレス（確認用と一致しません）');\n  var a = Number($('age').value);\n  if (!(a > 0 && a < 120)) m.push('年齢');\n  else if (P.minAge != null && a < P.minAge) m.push('年齢（' + P.minAge + '歳以上が対象です）');\n  else if (P.guardianAge != null && a < P.guardianAge && !emailOk($('guardian').value)) m.push('保護者の方のメールアドレス');\n  if (P.eligibility && P.eligibility.length && eligTicks().some(function (t) { return !t; })) m.push('参加条件の確認');\n  if (!$('consent').checked) m.push('確認のチェック');\n  if (!selectionComplete()) m.push('実験参加日時');\n  if (P.honorarium) m = m.concat(honorMissing());\n  return m;\n}\nfunction updateSubmit() {\n  if (sending || !P) return;\n  var m = missingItems();\n  $('submitBtn').disabled = m.length > 0;\n}\nfunction setChooseTitle(text) { $('chooseTitle').innerHTML = esc(text) + ' <span class=\"req\">*<\/span>'; }\nfunction call(fn) {\n  var args = Array.prototype.slice.call(arguments, 1);\n  var t0 = Date.now();\n  return fetch(API_URL, {\n    method: 'POST', credentials: 'omit', redirect: 'follow', cache: 'no-store',\n    headers: { 'Content-Type': 'text/plain;charset=utf-8' },\n    body: JSON.stringify({ fn: fn, args: args })\n  }).then(function (r) {\n    if (!r.ok) throw new Error('通信に失敗しました（' + r.status + '）。時間をおいてもう一度お試しください。');\n    return r.json();\n  }, function () {\n    throw new Error('通信に失敗しました。電波の良いところで、もう一度お試しください。');\n  }).then(function (j) {\n    console.info('[timing] ' + fn + ' ' + (Date.now() - t0) + ' ms');\n    if (!j.ok) throw new Error(j.error);\n    return j.result;\n  });\n}\n\n// ---------------------------------------------------------------- init\n\nfunction showTab(name) {\n  ['book', 'status', 'resend'].forEach(function (t) {\n    show('panel-' + t, t === name);\n    var b = document.querySelector('#tabs [data-tab=\"' + t + '\"]');\n    b.classList.toggle('on', t === name);\n    b.setAttribute('aria-selected', String(t === name));\n  });\n  clearError();\n  var req = document.querySelector('#head .req-note');\n  if (req) req.classList.toggle('hidden', name !== 'book');   // only the booking tab has questions\n  if (name === 'status') loadStatus();\n  window.scrollTo(0, 0);\n}\nArray.prototype.forEach.call(document.querySelectorAll('#tabs [data-tab]'), function (b) {\n  b.onclick = function () { showTab(b.getAttribute('data-tab')); };\n});\n\n/** Name-free overview of every upcoming slot (for coordinators and participants alike). */\nfunction loadStatus() {\n  $('statusReload').disabled = true;\n  return call('apiStatus').then(function (st) {\n    if (st.hidden) { show('statusBox', false); show('tabStatus', false); return; }\n    var now = new Date();\n    $('statusSummary').innerHTML = '<div class=\"st-sum\"><span><b>' + st.participants + '<\/b>名が予約済み<\/span>' +\n      '<span>予約の入った枠 <b>' + st.bookedSlots + '<\/b><\/span><span>空き <b>' + st.openSlots + '<\/b>枠<\/span><\/div>' +\n      '<p class=\"note\">' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' + now.getHours() + ':' + ('0' + now.getMinutes()).slice(-2) + ' 時点<\/p>';\n    if (!st.slots.length) { $('statusList').innerHTML = '<p class=\"note\">これからの枠はありません。<\/p>'; return; }\n    var html = '', last = '';\n    st.slots.forEach(function (s) {\n      if (s.date !== last) {\n        html += (last ? '<\/div><\/div>' : '') + '<div class=\"st-day\"><div class=\"day-title\">' + esc(SlotPicker.dayLabel(s.date)) + '<\/div><div class=\"st-grid\">';\n        last = s.date;\n      }\n      var tag = s.status === 'full' ? '予約済み' : s.status === 'open' ? '空き' : '受付終了';\n      if (s.capacity > 1) tag = (s.status === 'full' ? '満員 ction (p) {\n  P = p;\n  document.title = p.title || document.title;\n  var head = '<h1>' + esc(p.title) + '<\/h1><div class=\"meta\">研究責任者：' + esc(p.pi) +\n    (p.ethicsNo ? '　倫理承認番号：' + esc(p.ethicsNo) : '') + '<br>場所：' + esc(p.place) + '　1回あたり約' + esc(p.length) + '分' +\n    (p.dayPhone ? '<br>当日の連絡先：' + esc(p.dayPhone) : '') + '<\/div>';\n  $('head').innerHTML = head;\n  if (p.benefits && p.state === 'open') {\n    var lines = String(p.benefits).split('\\n');\n    $('benefits').innerHTML = '<h2>参加すると得られるもの<\/h2>' + lines.map(function (l) {\n      return /^\\s*[・\\-]/.test(l) ? '<p class=\"benefit-item\">' + esc(l.replace(/^\\s*[・\\-]\\s*/, '')) + '<\/p>' : '<p>' + esc(l) + '<\/p>';\n    }).join('');\n    show('benefits', true);\n  }\n  if (p.resultsConsent) { $('wantResultsLabel').textContent = p.resultsConsent; show('wantResultsBox', true); }\n  show('resendBox', true);\n  show('tabs', true);\n  if (p.state !== 'open') {\n    $('head').innerHTML += '<div class=\"msg warn\">' + esc(p.message) + '<\/div>';\n    return;\n  }\n  $('head').innerHTML += '<p class=\"req-note\">* 必須の質問です<\/p>';\n  $('infoLink').innerHTML = p.infoUrl ? '<a href=\"' + esc(p.infoUrl) + '\" target=\"_blank\" rel=\"noopener\">研究の説明文<\/a>を読み、' : '';\n  $('guardianNote').textContent = p.guardianNote;\n  $('age').oninput = function () {\n    var a = Number($('age').value);\n    show('guardianBox', p.guardianAge != null && a > 0 && a < p.guardianAge);\n  };\n  show('profile', true);\n  show('choose', true);\n  show('honor', !!p.honorarium);\n  show('confirm', true);\n  ['familyName', 'givenName', 'familyKana', 'givenKana', 'email', 'email2', 'age', 'guardian'].forEach(function (id) {\n    $(id).addEventListener('input', updateSubmit);\n  });\n  ['email', 'email2'].forEach(function (id) { $(id).addEventListener('blur', renderEmailHint); $(id).addEventListener('input', function () { if (!$('emailHint').classList.contains('hidden')) renderEmailHint(); }); });\n  if (p.eligibility && p.eligibility.length) {\n    $('eligList').innerHTML = p.eligibility.map(function (t, i) {\n      return '<label class=\"check\"><input type=\"checkbox\" data-i=\"' + i + '\"><span>' + esc(t) + '<\/span><\/label>';\n    }).join('');\n    $('eligNote').textContent = '当てはまらない項目がある場合は、予約の前に ' + p.contact + ' へご相談ください。';\n    Array.prototype.forEach.call(document.querySelectorAll('#eligList input'), function (c) { c.addEventListener('change', updateSubmit); });\n    show('eligCard', true);\n  }\n  $('consent').addEventListener('change', updateSubmit);\n  startChoose();\n}).catch(fail);\n\n// ---------------------------------------------------------------- choose\n\nfunction startChoose() {\n  chosen = []; prefs = []; repeatState = null;\n  var n = P.labels.length;\n  if (P.bookingMode === 'preference') {\n    setChooseTitle('ご都合のよい実験参加日時（すべて選んでください）');\n    $('chooseNote').textContent = (P.closeAtLabel ? P.closeAtLabel + 'に締め切ったあと、' : '') +\n      '選んだ候補の中から研究者が日時を決め、メールでお知らせします。候補が多いほど決まりやすくなります。';\n    prefs = P.labels.map(function () { return []; });\n    renderPreference(0);\n  } else if (P.sequenceMode === 'repeat') {\n    setChooseTitle('実験参加日時（全' + n + '回）');\n    $('chooseNote').textContent = '事前の回 → 毎週の曜日と時刻 → 事後の回 の順に選びます。';\n    renderSeriesStep(0);\n  } else {\n    setChooseTitle(n > 1 ? '実験参加日時（全' + n + '回）' : '実験参加日時');\n    $('chooseNote').textContent = n > 1 ? '第1回から順に選びます。2回目以降は、決められた間隔に合う日時だけが表示されます。' : '';\n    renderSeriesStep(0);\n  }\n}\n\nfunction renderChosen() {\n  renderSummary();\n  $('chosenList').innerHTML = chosen.map(function (c, i) {\n    return '<div class=\"chosen\"><span>' + (P.labels[i] ? '<b>' + esc(P.labels[i]) + '<\/b>　' : '') + esc(c.label) + '<\/span>' +\n      '<button type=\"button\" class=\"sub\" data-i=\"' + i + '\">選び直す<\/button><\/div>';\n  }).join('');\n  Array.prototype.forEach.call(document.querySelectorAll('#chosenList button'), function (b) {\n    b.onclick = function () {\n      var i = Number(b.getAttribute('data-i'));\n      chosen = chosen.slice(0, i);\n      if (repeatState && i < P.repeat.pre + repeatBlockSize()) repeatState = null;\n      renderSeriesStep(i);\n    };\n  });\n}\n\nfunction repeatBlockSize() { return P.repeat ? P.repeat.perWeek * P.repeat.weeks : 0; }\n\n/** Step i of a single / series / repeat booking. */\nfunction renderSeriesStep(i) {\n  renderChosen();\n  var n = P.labels.length;\n  if (i >= n) { renderConfirm(); return; }\n  if (P.sequenceMode === 'repeat' && i === P.repeat.pre) { renderRepeatChooser(); return; }\n  var title = '<p>' + (P.labels[i] ? '<b>' + esc(P.labels[i]) + '<\/b> の' : '') + '日時を選んでください<br><span class=\"note\">色の付いた日をタップ → 時間をタップ<\/span><\/p>';\n  var load = i === 0 ? Promise.resolve(P.slots) : (\n    $('picker').innerHTML = title + '<p class=\"spinner\">候補を探しています…<\/p>',\n    call('apiOptions', chosen.map(function (c) { return c.id; }), i));\n  load.then(function (opts) {\n    var hint = opts.some(function (s) { return s.near; })\n      ? '<p class=\"note\">★の付いた日時があれば、ご都合が合う範囲でそちらを優先してお選びください。<\/p>' : '';\n    $('picker').innerHTML = title + hint + '<div id=\"cal\"><\/div>' + (i === 0 ? waitlistHtml() : '');\n    if (i === 0) bindWaitlist();\n    SlotPicker.render($('cal'), opts, {\n      isOn: function () { return false; },\n      onTap: function (s) {\n        chosen[i] = { id: s.id, label: s.label };\n        chosen = chosen.slice(0, i + 1);\n        renderSeriesStep(i + 1);\n        window.scrollTo(0, $('choose').offsetTop);\n      }\n    });\n  }).catch(fail);\n}\n\n// ---- cancel waitlist (first-come, single session)\n\nfunction waitlistHtml() {\n  if (!P.waitlist || !P.waitlist.length) return '';\n  return '<details class=\"wl\"><summary>ご希望の日時が満席の場合（キャンセル待ち）<\/summary>' +\n    '<p class=\"note\">満席の日時にキャンセル待ちを登録できます。空きが出たらメールでお知らせします（先着順で予約していただきます）。' +\n    '上の「お名前」「ふりがな」「メールアドレス」を入れてから登録してください。<\/p>' +\n    '<div class=\"slots\" id=\"wlGrid\">' + P.waitlist.map(function (s) {\n      return '<button type=\"button\" class=\"slot\" data-id nnerHTML = '<p class=\"msg warn\">繰り返しの日程を組める期間が残っていません。研究者へご連絡ください。<\/p>'; return; }\n    var html = '<p><b>毎週の日時<\/b>を選んでください（週' + P.repeat.perWeek + '回 × ' + P.repeat.weeks + '週）<\/p>' +\n      '<label for=\"weekSel\">開始する週<\/label><select id=\"weekSel\">' +\n      r.weeks.map(function (w) { return '<option value=\"' + esc(w.monday) + '\">' + esc(w.label) + '<\/option>'; }).join('') + '<\/select>' +\n      '<label>曜日と時刻（' + P.repeat.perWeek + 'つ選ぶ）<\/label><div class=\"slots\" id=\"patGrid\">' +\n      r.patterns.map(function (p, k) {\n        return '<button type=\"button\" class=\"slot\" data-k=\"' + k + '\">' + esc(p.label) + '<\/button>';\n      }).join('') + '<\/div>' +\n      '<p class=\"note\">同じ週の中は' + P.repeat.minGap + '日以上あけてください。合わない週は次の画面で個別に振り替えられます。<\/p>' +\n      '<div class=\"row\"><button type=\"button\" id=\"planBtn\" disabled>この曜日・時刻で日程を組む<\/button><\/div><div id=\"planBox\"><\/div>';\n    $('picker').innerHTML = html;\n    var picked = [];\n    Array.prototype.forEach.call(document.querySelectorAll('#patGrid .slot'), function (b) {\n      b.onclick = function () {\n        var k = Number(b.getAttribute('data-k'));\n        var at = picked.indexOf(k);\n        if (at >= 0) picked.splice(at, 1); else if (picked.length < P.repeat.perWeek) picked.push(k);\n        Array.prototype.forEach.call(document.querySelectorAll('#patGrid .slot'), function (x) {\n          x.classList.toggle('on', picked.indexOf(Number(x.getAttribute('data-k'))) >= 0);\n        });\n        $('planBtn').disabled = picked.length !== P.repeat.perWeek;\n      };\n    });\n    $('planBtn').onclick = function () {\n      var pats = picked.map(function (k) { return { weekday: r.patterns[k].weekday, startMin: r.patterns[k].startMin }; });\n      var monday = $('weekSel').value;\n      $('planBox').innerHTML = '<p class=\"spinner\">日程を組んでいます…<\/p>';\n      call('apiRepeatPlan', preIds, monday, pats).then(function (plan) {\n        repeatState = { preIds: preIds, plan: plan, blockIds e.message || '')) { call('apiGetPage').then(function (p) { P = p; startChoose(); }); }\n  });\n};\n\nfunction submitHonorOnly(btn) {\n  if (!H.addressOk) {\n    busy(true);\n    $('sendingNote').textContent = '住所を確認しています…';\n    call('apiCheckAddress', $('hZip').value, $('hAddress').value).then(function (r) {\n      busy(false);\n      $('sendingNote').textContent = '送信中です。10秒ほどかかります。画面を閉じずにお待ちください。';\n      if (!r.issues.length) { H.addressOk = true; submitHonorOnly(btn); return; }\n      askInline($('confirm'), '郵便番号・住所をご確認ください：\\n' + r.issues.join('\\n') + '\\n正しければ、このまま送信できます。', 'このまま送信', '住所を直す',\n        function () { H.addressOk = true; submitHonorOnly(btn); }, function () { $('hZip').scrollIntoView({ block: 'center', behavior: 'smooth' }); });\n    }).catch(function () { busy(false); H.addressOk = true; submitHonorOnly(btn); });\n    return;\n  }\n  busy(true);\n  call('apiSubmitHonorarium', HON_TOKEN, honorPayload()).then(function () {\n    ['honor', 'confirm'].forEach(function (id) { show(id, false); });\n    $('done').innerHTML = '<p class=\"done-title\">回答を記録しました<\/p><div class=\"msg ok\">謝金の振込に必要な情報を受け付けました。ありがとうございました。<\/div>';\n    show('done', true);\n    window.scrollTo(0, 0);\n  }).catch(fail);\n}\n\n// ---------------------------------------------------------------- honorarium (謝金申請)\n\n/** Inline question under an element (some in-app browsers suppress window.confirm). */\nfunction askInline(anchor, text, yesLabel, noLabel, onYes, onNo) {\n  Array.prototype.forEach.call(document.querySelectorAll('.ask'), function (el) { el.remove(); });\n  var box = document.createElement('div');\n  box.className = 'ask';\n  box.innerHTML = '<p style=\"white-space:pre-wrap\">' + esc(text) + '<\/p><div class=\"row\"><button type=\"button\" class=\"yes\">' + esc(yesLabel) +\n    '<\/button><button type=\"button\" class=\"sub no\">' + esc(noLabel) + '<\/button><\/div>';\n  anchor.parentNode.insertBefore(box, anchor);\n  box.querySelector('.yes').onclick = function () { box.remove(); onYes(); };\n  box.querySelector('.no').onclick = function () { box.remove(); if (onNo) onNo(); };\n  box.scrollIntoView({ block: 'center', behavior: 'smooth' });\n}\n\nvar H = { bank: null, branch: null, branches: [], photoId: '', check: null, checking: false, zipFilled: '', stationsFor: '', unreadableIds: [] };\n/** A photo the page could not read: remembered so that one retake is asked for, then sending is allowed. */\nfunction noteUnreadable() {\n  if (H.photoId && H.check && H.check.status === 'unreadable' && H.unreadableIds.indexOf(H.photoId) < 0) H.unreadableIds.push(H.photoId);\n}\nfunction needRetake() { return !!(H.check && H.check.status === 'unreadable' && H.unreadableIds.length < 2); }\nfunction digits(v) { return String(v || '').replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/\\D/g, ''); }\nfunction toKatakanaJs(v) { return String(v || '').replace(/\\s+/g, '').replace(/[ぁ-ゖ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) + 0x60); }); }\nfunction radio(name) { var r = document.querySelector('input[name=\"' + name + '\"]:checked'); return r ? r.value : ''; }\nfunction isYucho() { return H.bank && H.bank.code === '9900'; }\n/** 楽天 → 楽天銀行, but 城南信用金庫 / 本店 / 日吉出張所 keep their own ending. */\nfunction bankLabel(name) { return /(銀行|信用金庫|信用組合|労働金庫|農業協同組合|漁業協同組合|信金|信組|労金|農協|漁協|信連|信漁連|金庫|組合)$/.test(name) ? name : name + '銀行'; }\nfunction branchLabel(name) { return /(店|出張所|営業部|支所|事務所|センター)$/.test(name) ? name : name + '支店'; }\nvar debounce = function (fn, ms) { var t = null; return function () { clearTimeout(t); t = setTimeout(fn, ms); }; };\n\nfunction ageFromBirth(b) {\n  var m = String(b || '').match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);\n  if (!m) return NaN;\n  var now = new Date(), a = now.getFullYear() - (+m[1]);\n  if (now.getMonth() + 1 < +m[2] || (now.getMonth() + 1 === +m[2] && now.getDate() < +m[3])) a--;\n  return a;\n}\n\nfunction honorMissing() {\n  var m = [];\n  if (digits($('hZip').value).length !== 7) m.push('自宅郵便番号');\n  if ($('hAddress').value.trim().length < 6 || !/[0-9０-９一二三四五六七八九十丁番]/.test($('hAddress').value)) m.push('自宅住所（番地まで）');\n  if (!$('hStation').value.trim()) m.push('最寄駅名');\n  var ph = digits($('hPhone').value);\n  if (!/^0\\d{9,10}$/.test(ph)) m.push('携帯番号');\n  var a = ageFromBirth($('hBirth').value);\n  if (isNaN(a)) m.push('生年月日');\n  else if (Number($('age').value) > 0 && a !== Number($('age').value)) m.push('生年月日（年齢と合いません）');\n  var aff = radio('hAff');\n  if (!aff) m.push('所属');\n  else {\n    if (!$('hFaculty').value.trim()) m.push(aff === 'external' ? '所属先' : '所属学部（研究科）');\n    if (!$('hPosition').value.trim()) m.push(aff === 'external' ? '職位' : '学年');\n    if (aff !== 'external' && !/^[0-9A-Za-z]{4,12}$/.test($('hNumber').value.trim())) m.push('学籍番号（教職員番号）');\n  }\n  if (!H.bank) m.push('振込先の銀行');\n  else if (isYucho()) {\n    if (!/^1\\d{3}0$/.test(digits($('hKigou').value)) || !/^\\d{2,8}$/.test(digits($('hBangou').value))) m.push('ゆうちょ銀行の記号・番号');\n    else if (digits($('hBangou').value) !== digits($('hBangou2').value)) m.push('確認用の番号（一致していません）');\n  } else {\n    if (!H.branch) m.push('振込先の支店');\n    if (!/^\\d{1,7}$/.test(digits($('hAccount').value))) m.push('口座番号');\n    else if (digits($('hAccount').value) !== digits($('hAccount2').value)) m.push('確認用の口座番号（一致していません）');\n  }\n  if (!H.photoId) m.push('通帳またはキャッシュカードの写真');\n  else if (H.checking) m.push('写真の照合（確認中）');\n  else if (H.check && H.check.status === 'mismatch') m.push('写真と口座番号の照合（一致していません）');\n  else if (needRetake()) m.push('通帳またはキャッシュカードの写真（読み取れなかったため撮り直してください）');\n  var pass = radio('hPass');\n  if (!pass) m.push('定期券');\n  else if (pass === 'yes' && (!$('hPassFrom').value || !$('hPassTo').value || $('hPassFrom').value > $('hPassTo').value)) m.push('定期券の期間');\n  return m;\n}\n\nfunction honorPayload() {\n  return {\n    zip: $('hZip').value, address: $('hAddress').value, phone: $('hPhone').value, birth: $('hBirth').value,\n    affiliation: radio('hAff'), faculty: $('hFaculty').value, position: $('hPosition').value, number: $('hNumber').value,\n    bankCode: H.bank ? H.bank.code : '', branchCode: H.branch ? H.branch.code : '',\n    account: $('hAccount').value, account2: $('hAccount2').value,\n    kigou: $('hKigou').value, bangou: $('hBangou').value, bangou2: $('hBangou2').value,\n    photoId: H.photoId, unreadablePhotoIds: H.unreadableIds.slice(), station: $('hStation').value,\n    stationPref: Array.prototype.some.call($('hStations').querySelectorAll('.chip'), function (b) { return b.getAttribute('data-name') === $('hStation').value.trim(); }) ? (H.stationPref || '') : '',\n    pass: { has: radio('hPass') === 'yes', from: $('hPassFrom').value, to: $('hPassTo').value }\n  };\n}\n\nfunction want() {\n  return { bankCode: H.bank ? H.bank.code : '', branchCode: H.branch ? H.branch.code : '', account: digits($('hAccount').value),\n           kigou: digits($('hKigou').value), bangou: digits($('hBangou').value) };\n}\n\nfunction showPhotoState() {\n  var el = $('hPhotoState'), c = H.check;\n  el.className = 'note';\n  if (!H.photoId) { el.textContent = ''; return; }\n  if (H.checking) { el.textContent = '写真を照合しています…'; return; }\n  if (!c || c.status === 'pending') { el.textContent = '写真を受け取りました。口座番号を入れると、写真と照合します。'; return; }\n  if (c.status === 'ok') { el.textContent = '✓ 写真の番号と入力が一致しました。'; el.className = 'note ok-text'; return; }\n  if (c.status === 'unreadable' && needRetake()) {\n    el.className = 'msg err';\n    el.textContent = '写真から数字を読み取れませんでした。銀行名・支店番号・口座番号がはっきり写るように、明るい場所で真上から撮り直して、もう一度添付してください（撮り直すまで送信できません）。';\n    return;\n  }\n  if (c.status === 'unreadable') { el.className = 'msg warn'; el.textContent = '撮り直した写真からも数字を読み取れませんでした。このまま送信できます（研究者が写真を目で確認します）。'; return; }\n  el.className = 'msg err';\n  el.textContent = '写真の' + (c.what === 'branch' ? (isYucho() ? '記号' : '支店番号') : (isYucho() ? '番号' : '口座番号')) + '（読み取り：' + c.read.join('・') +\n    '）と入力が一致しません。入力を確かめるか、数字がはっきり写った写真を選び直してください。';\n}\ anchPicked', true);\n  $('hBranchChange').onclick = function () { pickBranch(null); $('hBranchQ').value = ''; $('hBranchQ').focus(); recheck(); updateSubmit(); };\n  recheck(); updateSubmit();\n}\n\nfunction optButtons(el, list, label, onPick) {\n  el.innerHTML = list.map(function (x, i) { return '<button type=\"button\" class=\"opt\" data-i=\"' + i + '\">' + label(x) + '<\/button>'; }).join('');\n  Array.prototype.forEach.call(el.querySelectorAll('.opt'), function (b) { b.onclick = function () { onPick(list[+b.getAttribute('data-i')]); }; });\n}\n\n$('hBankQ').addEventListener('input', debounce(function () {\n  var q = $('hBankQ').value.trim();\n  if (!q) { $('hBankList').innerHTML = ''; return; }\n  call('apiBankSearch', q).then(function (list) {\n    if (!list.length) { $('hBankList').innerHTML = '<p class=\"note\">見つかりません。銀行名の一部をひらがなか漢字で入れてください。<\/p>'; return; }\n    optButtons($('hBankList'), list, function (b) { return esc(b.name) + '<small>' + esc(b.kana) + '・' + esc(b.code) + '<\/small>'; }, pickBank);\n  }).catch(fail);\n}, 350));\n\n$('hBranchQ').addEventListener('input', function () {\n  var q = $('hBranchQ').value.trim().replace(/(支店|してん|シテン)$/, '');\n  if (!q) { $('hBranchList').innerHTML = ''; return; }\n  var k = toKatakanaJs(q), h = toHiragana(q);\n  var hit = H.branches.filter(function (b) { return b.code.indexOf(q) === 0 || b.name.indexOf(q) >= 0 || b.kana.indexOf(k) === 0 || b.hira.indexOf(h) === 0; }).slice(0, 20);\n  if (!hit.length) { $('hBranchList').innerHTML = '<p class=\"note\">見つかりません。支店名の一部か支店番号を入れてください。<\/p>'; return; }\n  optButtons($('hBranchList'), hit, function (b) { return esc(b.name) + '<small>' + esc(b.kana) + '・' + esc(b.code) + '<\/small>'; }, pickBranch);\n});\n\n$('hZip').addEventListener('input', function () {\n  var d = digits($('hZip').value);\n  if (d.length !== 7 || d === H.zipFilled) return;\n  H.zipFilled = d;\n  call('apiZipLookup', d).then(function (r) {\n    if (!r.address) return;\n    var cur = $('hAddress').value. '00000000' + n).slice(-8, -1) : '';\n    }\n    recheck(); updateSubmit();\n  });\n});\n['familyName', 'givenName', 'familyKana', 'givenKana'].forEach(function (id) { $(id).addEventListener('input', renderHolder); });\n\n/** Shrink the photo on the phone (max 1600 px, JPEG) before sending it. */\nfunction shrinkPhoto(file) {\n  return new Promise(function (resolve, reject) {\n    var url = URL.createObjectURL(file);\n    var img = new Image();\n    img.onload = function () {\n      var scale = Math.min(1, 1600 / Math.max(img.width, img.height));\n      var cv = document.createElement('canvas');\n      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);\n      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);\n      URL.revokeObjectURL(url);\n      resolve(cv.toDataURL('image/jpeg', 0.85));\n    };\n    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('この写真は読み込めません。JPEGかPNGの写真を選んでください。')); };\n    img.src = url;\n  });\n}\n$('hPhoto').addEventListener('change', function () {\n  var f = $('hPhoto').files[0];\n  if (!f) return;\n  H.photoId = ''; H.check = null; H.checking = true;\n  $('hPhotoState').className = 'note';\n  $('hPhotoState').textContent = '写真を送っています…（10秒ほど）';\n  updateSubmit();\n  shrinkPhoto(f).then(function (dataUrl) { return call('apiUploadBankPhoto', dataUrl, want()); }).then(function (r) {\n    H.photoId = r.photoId; H.check = r.check;\n    noteUnreadable();\n  }).catch(function (e) { H.photoId = ''; $('hPhotoState').className = 'msg err'; $('hPhotoState').textContent = (e && e.message) || String(e); })\n    .then(function () {\n      H.checking = false;\n      if (H.photoId) showPhotoState();\n      updateSubmit();\n      // an unreadable photo is pointed out where the participant is looking\n      if (needRetake()) { $('hPhotoState').scrollIntoView({ block: 'center', behavior: 'smooth' }); $('hPhoto').value = ''; }\n    });\n});\n\n$('resendBtn').onclick = function () {\n  $('resendBtn').disabled = true;\n  call('apiResend', $('resendEmail').value).then(function () {\n    $('resendMsg').innerHTML = '<div class=\"msg ok\">登録があれば、そのアドレスにリンクを送りました。届かない場合は迷惑メールフォルダもご確認ください。<\/div>';\n  }).catch(fail).then(function () { $('resendBtn').disabled = false; });\n};\n");
