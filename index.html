<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>実験の日程調整</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1f2328; --muted: #5f6670; --line: #d9dde3;
    --accent: #0b5cad; --accent-weak: #e7f0fa; --ok: #1a7f37; --warn: #9a6700; --warn-weak: #fff4d6;
    --err: #b42318; --err-weak: #fdecea;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    font-size: 16px; line-height: 1.7; }
  main { max-width: 680px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.35rem; line-height: 1.4; margin: 8px 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 8px; }
  .meta { color: var(--muted); font-size: .9rem; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input[type=text], input[type=email], input[type=number], select {
    width: 100%; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; margin-top: 16px; }
  .check input { width: 22px; height: 22px; margin-top: 3px; flex: none; }
  button { font-size: 16px; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  button.sub { background: #fff; color: var(--accent); }
  button.danger { background: #fff; color: var(--err); border-color: var(--err); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .day { margin-top: 14px; }
  .day-title { font-weight: 700; font-size: .95rem; border-bottom: 1px solid var(--line); padding-bottom: 2px; margin-bottom: 8px; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .slot { background: #fff; color: var(--text); border: 1px solid var(--line); font-weight: 500; padding: 10px 8px; text-align: center; }
  .slot.on { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .slot small { display: block; color: var(--muted); font-weight: 400; font-size: .78rem; }
  .chosen { background: var(--accent-weak); border-radius: 8px; padding: 8px 12px; margin: 6px 0; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .chosen button { padding: 4px 10px; font-size: .85rem; }
  .note { color: var(--muted); font-size: .9rem; }
  .msg { border-radius: 10px; padding: 12px 14px; margin: 12px 0; white-space: pre-wrap; }
  .msg.err { background: var(--err-weak); color: var(--err); }
  .msg.warn { background: var(--warn-weak); color: var(--warn); }
  .msg.ok { background: #e9f6ec; color: var(--ok); }
  .plan-item { border-bottom: 1px solid var(--line); padding: 8px 0; }
  .plan-item .ng { color: var(--warn); font-weight: 700; }
  .badge { display: inline-block; font-size: .8rem; border-radius: 999px; padding: 0 8px; border: 1px solid var(--line); color: var(--muted); }
  .badge.rebook { border-color: var(--warn); color: var(--warn); }
  .ask { background: var(--warn-weak); border: 2px solid var(--warn); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
  .ask p { margin: 0; font-weight: 600; }
  /* calendar picker (Picker.html) */
  .cal { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: #fff; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-title { font-weight: 700; font-size: 1.05rem; }
  .cal-nav { background: #fff; color: var(--accent); border: 1px solid var(--line); width: 44px; height: 40px; padding: 0; font-size: 1.4rem; line-height: 1; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-wd { text-align: center; font-size: .8rem; color: var(--muted); padding: 2px 0; }
  .cal-wd.sun, .cal-day.sun .cal-num { color: #c62828; }
  .cal-wd.sat, .cal-day.sat .cal-num { color: #1565c0; }
  .cal-day { min-height: 54px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 4px 0; font-weight: 500; border: 1px solid transparent; background: transparent; color: var(--text); }
  .cal-day.off { opacity: .35; }
  .cal-day.blank { visibility: hidden; }
  .cal-day.open { background: var(--accent-weak); border-color: #b9d1ec; cursor: pointer; }
  .cal-day.open .cal-num { font-weight: 700; }
  .cal-day.sel { background: var(--accent); border-color: var(--accent); }
  .cal-day.sel .cal-num, .cal-day.sel .cal-cnt { color: #fff; }
  .cal-day.has-on:not(.sel) { border: 2px solid var(--accent); }
  .cal-num { font-size: 1rem; line-height: 1.2; }
  .cal-cnt { font-size: .68rem; color: var(--accent); line-height: 1.2; }
  .cal-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 8px; font-size: .78rem; color: var(--muted); }
  .cal-legend .lg { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid #b9d1ec; background: var(--accent-weak); }
  .cal-legend .lg.sel { background: var(--accent); border-color: var(--accent); margin-left: 6px; }
  .cal-times { margin-top: 14px; }
  .cal-times .day-title { font-size: 1rem; }
  @media (max-width: 420px) { .cal { padding: 8px 6px; } .cal-grid { gap: 3px; } .cal-day { min-height: 48px; } .cal-cnt { font-size: .62rem; } }
  /* overall status (no names) */
  .st-sum { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .95rem; }
  .st-sum b { font-size: 1.15rem; color: var(--accent); }
  .st-day { margin-top: 12px; }
  .st-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .st-item { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 7px 10px;
    border-radius: 8px; border: 1px solid var(--line); font-size: .9rem; background: #fff; }
  .st-tag { font-size: .78rem; font-weight: 700; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .st-open .st-tag { color: var(--ok); background: #e9f6ec; }
  .st-full { background: #eef1f5; }
  .st-full .st-tag { color: #fff; background: #5f6b7a; }
  .st-closed { opacity: .6; }
  .st-closed .st-tag { color: var(--muted); background: #f0f0f0; }
  .st-closed.st-has { opacity: 1; }
  @media (max-width: 420px) { .st-grid { grid-template-columns: repeat(2, 1fr); } .st-item { flex-direction: column; align-items: flex-start; gap: 2px; } }
  .name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  label.sub-label { font-weight: 400; font-size: .85rem; color: var(--muted); margin: 0 0 2px; }
  .hidden { display: none; }
  .spinner { color: var(--muted); padding: 12px 0; }
  a { color: var(--accent); }
  @media (max-width: 420px) { main { padding: 12px; } .slots { grid-template-columns: repeat(2, 1fr); } }
</style>
<script>
/**
 * Calendar-style slot picker shared by the booking and manage pages.
 * Month grid: days with open slots are highlighted with their count; tapping a day
 * lists that day's times underneath. Self-contained (no helpers from the pages).
 *
 * SlotPicker.render(container, slots, {
 *   isOn(slot) -> bool,          // highlighted times (selected / multi-select)
 *   onTap(slot),                 // time tapped
 *   state: {},                   // pass the same object across re-renders to keep month/day
 *   emptyText: '...'
 * })
 * slots: [{id, date:'yyyy-MM-dd', startMin, endMin, remaining|null}]
 */
var SlotPicker = (function () {
  var WD = ['日', '月', '火', '水', '木', '金', '土'];

  function h(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hm(m) { return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function key(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function parts(k) { var p = k.split('-'); return { y: +p[0], m: +p[1] - 1, d: +p[2] }; }
  function dayLabel(k) {
    var p = parts(k), wd = new Date(p.y, p.m, p.d).getDay();
    return (p.m + 1) + '月' + p.d + '日（' + WD[wd] + '）';
  }

  function render(container, slots, opts) {
    opts = opts || {};
    var st = opts.state || (container._pickerState = container._pickerState || {});
    var byDay = {};
    slots.forEach(function (s) { (byDay[s.date] = byDay[s.date] || []).push(s); });
    var days = Object.keys(byDay).sort();
    if (!days.length) {
      container.innerHTML = '<p class="msg warn">' + h(opts.emptyText ||
        '選べる日時がありません。条件に合う日時が埋まっているか、締め切られました。') + '</p>';
      return;
    }
    // keep the chosen day if still available; else the day of a selected time; else the first open day
    if (!st.day || !byDay[st.day]) {
      var on = slots.filter(function (s) { return opts.isOn && opts.isOn(s); })[0];
      st.day = on ? on.date : days[0];
    }
    if (st.month == null) { var p0 = parts(st.day); st.year = p0.y; st.month = p0.m; }
    var first = parts(days[0]), last = parts(days[days.length - 1]);
    var minIdx = first.y * 12 + first.m, maxIdx = last.y * 12 + last.m;
    var curIdx = Math.min(Math.max(st.year * 12 + st.month, minIdx), maxIdx);
    st.year = Math.floor(curIdx / 12); st.month = curIdx % 12;

    var html = '<div class="cal" role="group" aria-label="日付を選ぶ">' +
      '<div class="cal-head">' +
      '<button type="button" class="cal-nav" data-nav="-1" aria-label="前の月"' + (curIdx <= minIdx ? ' disabled' : '') + '>‹</button>' +
      '<div class="cal-title">' + st.year + '年' + (st.month + 1) + '月</div>' +
      '<button type="button" class="cal-nav" data-nav="1" aria-label="次の月"' + (curIdx >= maxIdx ? ' disabled' : '') + '>›</button>' +
      '</div><div class="cal-grid">';
    WD.forEach(function (w, i) { html += '<div class="cal-wd' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') + '">' + w + '</div>'; });
    var lead = new Date(st.year, st.month, 1).getDay();
    var n = new Date(st.year, st.month + 1, 0).getDate();
    var cells = [];
    for (var b = 0; b < lead; b++) cells.push({ html: '<div class="cal-day blank"></div>', open: false });
    for (var d = 1; d <= n; d++) {
      var k = key(st.year, st.month, d);
      var list = byDay[k] || [];
      var wd = (lead + d - 1) % 7;
      var cls = 'cal-day' + (wd === 0 ? ' sun' : wd === 6 ? ' sat' : '');
      if (!list.length) { cells.push({ html: '<div class="' + cls + ' off" aria-hidden="true"><span class="cal-num">' + d + '</span></div>', open: false }); continue; }
      var picked = list.filter(function (s) { return opts.isOn && opts.isOn(s); }).length;
      cls += ' open' + (k === st.day ? ' sel' : '') + (picked ? ' has-on' : '');
      cells.push({ open: true, html: '<button type="button" class="' + cls + '" data-day="' + k + '" aria-pressed="' + (k === st.day) + '" aria-label="' +
        h(dayLabel(k) + ' 空き' + list.length + '枠' + (picked ? '・選択' + picked : '')) + '">' +
        '<span class="cal-num">' + d + '</span><span class="cal-cnt">' + (picked ? '✓' + picked : list.length + '枠') + '</span></button>' });
    }
    // weeks before the first / after the last open day are dropped so the times stay near the top on phones
    var rows = [];
    for (var r = 0; r < cells.length; r += 7) rows.push(cells.slice(r, r + 7));
    var hasOpen = function (row) { return row.some(function (c) { return c.open; }); };
    var firstOpen = 0, lastOpen = rows.length - 1;
    while (firstOpen < lastOpen && !hasOpen(rows[firstOpen])) firstOpen++;
    while (lastOpen > firstOpen && !hasOpen(rows[lastOpen])) lastOpen--;
    rows.slice(firstOpen, lastOpen + 1).forEach(function (row) { row.forEach(function (c) { html += c.html; }); });
    html += '</div><div class="cal-legend"><span class="lg open"></span>予約できる日（数字は空き枠）<span class="lg sel"></span>表示中の日</div></div>';

    var times = byDay[st.day] || [];
    html += '<div class="cal-times"><div class="day-title">' + h(dayLabel(st.day)) + ' の空き時間</div><div class="slots">' +
      times.map(function (s) {
        var on = opts.isOn && opts.isOn(s);
        return '<button type="button" class="slot' + (on ? ' on' : '') + '" data-id="' + h(s.id) + '" aria-pressed="' + !!on + '">' +
          (on ? '✓ ' : '') + hm(s.startMin) + '〜' + hm(s.endMin) + (s.remaining != null ? '<small>残り' + s.remaining + '</small>' : '') + '</button>';
      }).join('') + '</div></div>';
    container.innerHTML = html;

    Array.prototype.forEach.call(container.querySelectorAll('.cal-nav'), function (btn) {
      btn.onclick = function () {
        var idx = st.year * 12 + st.month + Number(btn.getAttribute('data-nav'));
        st.year = Math.floor(idx / 12); st.month = idx % 12;
        // jump the shown day to the first open day of the new month
        var pre = key(st.year, st.month, 1).slice(0, 8);
        var inMonth = days.filter(function (x) { return x.slice(0, 8) === pre; });
        if (inMonth.length) st.day = inMonth[0];
        render(container, slots, Object.assign({}, opts, { state: st }));
      };
    });
    Array.prototype.forEach.call(container.querySelectorAll('.cal-day.open'), function (btn) {
      btn.onclick = function () {
        st.day = btn.getAttribute('data-day');
        render(container, slots, Object.assign({}, opts, { state: st }));
        var t = container.querySelector('.cal-times');
        if (t && t.scrollIntoView) t.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      };
    });
    Array.prototype.forEach.call(container.querySelectorAll('.cal-times .slot'), function (btn) {
      btn.onclick = function () {
        var s = times.filter(function (x) { return x.id === btn.getAttribute('data-id'); })[0];
        if (s && opts.onTap) opts.onTap(s, btn);
      };
    });
  }

  return { render: render, dayLabel: dayLabel, hm: hm };
})();
</script>
</head>

<template id="tpl-book">
<main>
  <div id="head"><p class="spinner">読み込んでいます…</p></div>
  <div id="error" class="msg err hidden"></div>

  <!-- 1. profile -->
  <section id="profile" class="card hidden">
    <h2>1. ご本人の情報</h2>
    <label>お名前</label>
    <div class="name-row">
      <div><label class="sub-label" for="familyName">姓</label><input id="familyName" type="text" maxlength="20" autocomplete="family-name" placeholder="例：西岡"></div>
      <div><label class="sub-label" for="givenName">名</label><input id="givenName" type="text" maxlength="20" autocomplete="given-name" placeholder="例：卓哉"></div>
    </div>
    <label>ふりがな（ひらがな）</label>
    <div class="name-row">
      <div><label class="sub-label" for="familyKana">せい</label><input id="familyKana" type="text" maxlength="20" placeholder="例：にしおか"></div>
      <div><label class="sub-label" for="givenKana">めい</label><input id="givenKana" type="text" maxlength="20" placeholder="例：たくや"></div>
    </div>
    <label for="email">メールアドレス（予約の確認・リマインドが届きます）</label>
    <input id="email" type="email" autocomplete="email" inputmode="email">
    <label for="age">年齢</label>
    <input id="age" type="number" min="1" max="119" inputmode="numeric">
    <div id="guardianBox" class="hidden">
      <div id="guardianNote" class="msg warn"></div>
      <label for="guardian">保護者の方のメールアドレス</label>
      <input id="guardian" type="email" inputmode="email">
    </div>
    <label class="check"><input id="consent" type="checkbox">
      <span><span id="infoLink"></span>この予約は研究への参加の同意ではなく、参加はいつでも取りやめられること（取りやめても不利益はないこと）を理解しました。</span></label>
  </section>

  <!-- 2. choose -->
  <section id="choose" class="card hidden">
    <h2 id="chooseTitle">2. 日時を選ぶ</h2>
    <p id="chooseNote" class="note"></p>
    <div id="chosenList"></div>
    <div id="picker"></div>
  </section>

  <!-- 3. confirm -->
  <section id="confirm" class="card hidden">
    <h2>3. 内容の確認</h2>
    <div id="summary"></div>
    <div class="row"><button id="submitBtn">この内容で申し込む</button></div>
  </section>

  <section id="done" class="card hidden"></section>

  <section id="statusBox" class="card hidden" aria-live="polite">
    <h2>全体の予約状況</h2>
    <p class="note">お名前は表示されません。</p>
    <div id="statusSummary"></div>
    <div id="statusList"></div>
    <div class="row"><button type="button" class="sub" id="statusReload">最新の状況にする</button></div>
  </section>

  <section id="resendBox" class="card hidden">
    <h2>予約済みの方</h2>
    <p class="note">予約の確認・取消・変更のリンクを、登録したメールアドレスにもう一度お送りします。</p>
    <input id="resendEmail" type="email" placeholder="登録したメールアドレス" inputmode="email">
    <div class="row"><button class="sub" id="resendBtn">リンクを再送する</button></div>
    <div id="resendMsg"></div>
  </section>
</main>
</template>
<template id="tpl-manage">
<main>
  <div id="head"><p class="spinner">読み込んでいます…</p></div>
  <div id="error" class="msg err hidden"></div>
  <div id="info" class="msg ok hidden"></div>
  <section id="list" class="card hidden"></section>
  <section id="picker" class="card hidden"></section>
</main>
</template>

kSel\">' +\n      r.weeks.map(function (w) { return '<option value=\"' + esc(w.monday) + '\">' + esc(w.label) + '<\/option>'; }).join('') + '<\/select>' +\n      '<label>曜日と時刻（' + P.repeat.perWeek + 'つ選ぶ）<\/label><div class=\"slots\" id=\"patGrid\">' +\n      r.patterns.map(function (p, k) {\n        return '<button type=\"button\" class=\"slot\" data-k=\"' + k + '\">' + esc(p.label) + '<\/button>';\n      }).join('') + '<\/div>' +\n      '<p class=\"note\">同じ週の中は' + P.repeat.minGap + '日以上あけてください。合わない週は次の画面で個別に振り替えられます。<\/p>' +\n      '<div class=\"row\"><button type=\"button\" id=\"planBtn\" disabled>この曜日・時刻で日程を組む<\/button><\/div><div id=\"planBox\"><\/div>';\n    $('picker').innerHTML = html;\n    var picked = [];\n    Array.prototype.forEach.call(document.querySelectorAll('#patGrid .slot'), function (b) {\n      b.onclick = function () {\n        var k = Number(b.getAttribute('data-k'));\n        var at = picked.indexOf(k);\n        if (at >= 0) picked.splice(at, 1); else if (picked.length < P.repeat.perWeek) picked.push(k);\n        Array.prototype.forEach.call(document.querySelectorAll('#patGrid .slot'), function (x) {\n          x.classList.toggle('on', picked.indexOf(Number(x.getAttribute('data-k'))) >= 0);\n        });\n        $('planBtn').disabled = picked.length !== P.repeat.perWeek;\n      };\n    });\n    $('planBtn').onclick = function () {\n      var pats = picked.map(function (k) { return { weekday: r.patterns[k].weekday, startMin: r.patterns[k].startMin }; });\n      var monday = $('weekSel').value;\n      $('planBox').innerHTML = '<p class=\"spinner\">日程を組んでいます…<\/p>';\n      call('apiRepeatPlan', preIds, monday, pats).then(function (plan) {\n        repeatState = { preIds: preIds, plan: plan, blockIds: plan.map(function (p) { return p.available ? p.id : ''; }), labels: plan.map(function (p) { return p.available ? p.label : ''; }) };\n        renderPlan();\n      }).catch(fail);\n    };\n  }).catch(fail);\n}\n\nfunction renderPlan() {\n  var rs = r le + '<div id=\"cal\"><\/div><p class=\"note\" id=\"prefCount\"><\/p><div class=\"row\">' +\n    (i > 0 ? '<button type=\"button\" class=\"sub\" id=\"prevBtn\">戻る<\/button>' : '') +\n    '<button type=\"button\" id=\"nextBtn\">' + (i + 1 < n ? '次の回へ' : '確認へ進む') + '<\/button><\/div>';\n  if ($('prevBtn')) $('prevBtn').onclick = function () { renderPreference(i - 1); };\n  $('nextBtn').onclick = function () { if (i + 1 < n) renderPreference(i + 1); else renderConfirm(); };\n  function draw() {\n    SlotPicker.render($('cal'), P.slots, {\n      state: calState,\n      isOn: function (s) { return prefs[i].indexOf(s.id) >= 0; },\n      onTap: function (s) {\n        var at = prefs[i].indexOf(s.id);\n        if (at >= 0) prefs[i].splice(at, 1); else prefs[i].push(s.id);\n        draw();\n      }\n    });\n    $('prefCount').textContent = '選んだ候補：' + prefs[i].length + '件';\n    $('nextBtn').disabled = !prefs[i].length;\n  }\n  draw();\n}\n\n// ---------------------------------------------------------------- confirm & submit\n\nfunction renderConfirm() {\n  var html;\n  if (P.bookingMode === 'preference') {\n    html = P.labels.map(function (l, i) {\n      var labels = P.slots.filter(function (s) { return prefs[i].indexOf(s.id) >= 0; }).map(function (s) { return s.label; });\n      return '<p><b>' + esc(l) + '<\/b>（候補' + labels.length + '件）<br>' + labels.map(esc).join('<br>') + '<\/p>';\n    }).join('');\n  } else {\n    html = '<ul>' + chosen.map(function (c, i) { return '<li><b>' + esc(P.labels[i]) + '<\/b>　' + esc(c.label) + '<\/li>'; }).join('') + '<\/ul>';\n  }\n  $('summary').innerHTML = html;\n  $('picker').innerHTML = '';\n  show('confirm', true);\n  window.scrollTo(0, $('confirm').offsetTop);\n}\n\n$('submitBtn').onclick = function () {\n  clearError();\n  var payload = {\n    familyName: $('familyName').value, givenName: $('givenName').value,\n    familyKana: $('familyKana').value, givenKana: $('givenKana').value, email: $('email').value, age: Number($('age').value),\n    guardianEmail: $('guardian').value, consent: $('consent').checked\n  };\n  if (!payload.consent) { fail({ message: '「1. ご本人の情報」の確認欄にチェックを入れてください。' }); return; }\n  busy(true);\n  var req = P.bookingMode === 'preference'\n    ? call('apiSubmitPreferences', Object.assign(payload, { choices: prefs }))\n    : call('apiBook', Object.assign(payload, { ids: chosen.map(function (c) { return c.id; }) }));\n  req.then(function (r) {\n    ['profile', 'choose', 'confirm', 'resendBox'].forEach(function (id) { show(id, false); });\n    var html = '<div class=\"msg ok\">' + (P.bookingMode === 'preference' ? '希望を受け付けました。日時が決まったらメールでお知らせします。' : '予約が確定しました。確認メールをお送りしました。') + '<\/div>' +\n      '<ul>' + r.items.map(function (x) { return '<li>' + esc(x) + '<\/li>'; }).join('') + '<\/ul>' +\n      '<p>予約の確認・取消・変更は、確認メールのリンクか次のページから行えます。<br><a href=\"' + esc(localManageUrl(r.manageUrl)) + '\">予約の確認ページ<\/a><\/p>';\n    if (r.lineCode) html += '<p class=\"msg warn\">LINEでもリマインドを受け取る場合は、' + (r.lineAddUrl ? '<a href=\"' + esc(r.lineAddUrl) + '\" target=\"_blank\" rel=\"noopener\">公式アカウントを友だち追加<\/a>し、' : '公式アカウントに') + '次のコードを送ってください：<b>' + esc(r.lineCode) + '<\/b><\/p>';\n    $('done').innerHTML = html;\n    show('done', true);\n    loadStatus();\n    window.scrollTo(0, 0);\n  }).catch(function (e) {\n    fail(e);\n    // availability may have changed: reload the options from the first unchanged step\n    if (/埋まった|締め切られ|いっぱい/.test(e.message || '')) { call('apiGetPage').then(function (p) { P = p; startChoose(); }); }\n  });\n};\n\n$('resendBtn').onclick = function () {\n  $('resendBtn').disabled = true;\n  call('apiResend', $('resendEmail').value).then(function () {\n    $('resendMsg').innerHTML = '<div class=\"msg ok\">登録があれば、そのアドレスにリンクを送りました。届かない場合は迷惑メールフォルダもご確認ください。<\/div>';\n  }).catch(fail).then(function () { $('resendBtn').disabled = false; });\n};\n");
}
