<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>実験の日程調整</title>
<style>
  /* form-style look: lavender page, white question cards, underlined inputs, purple accent */
  :root {
    --bg: #f0ebf8; --card: #ffffff; --text: #202124; --muted: #5f6368; --line: #dadce0;
    --accent: #673ab7; --accent-weak: #ede7f6; --accent-line: #d1c4e9;
    --ok: #188038; --warn: #b06000; --warn-weak: #fef7e0; --err: #d93025; --err-weak: #fce8e6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: Roboto, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", -apple-system, sans-serif;
    font-size: 16px; line-height: 1.6; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 12px 32px; }
  h1 { font-size: 1.75rem; font-weight: 400; line-height: 1.35; margin: 0 0 8px; }
  h2 { font-size: 1rem; font-weight: 500; margin: 0 0 10px; }
  .meta { color: var(--text); font-size: .9rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 22px 24px; margin-bottom: 12px; }
  .form-head { border-top: 10px solid var(--accent); padding-top: 20px; }
  .req-note { color: var(--err); font-size: .85rem; margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
  .q-title { display: block; font-size: 1rem; font-weight: 500; margin: 0 0 14px; }
  .req { color: var(--err); }
  .q-help { color: var(--muted); font-size: .85rem; margin: -8px 0 12px; }
  label { display: block; font-weight: 500; margin: 0 0 4px; }
  input[type=text], input[type=email], input[type=number], select {
    width: 100%; font-size: 16px; padding: 6px 0 5px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
    background: transparent; color: var(--text); outline: none; }
  input[type=text]:focus, input[type=email]:focus, input[type=number]:focus, select:focus { border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
  input::placeholder { color: #9aa0a6; }
  select { border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
  .check { display: flex; gap: 12px; align-items: flex-start; font-weight: 400; margin: 0; }
  .check input { width: 20px; height: 20px; margin-top: 3px; flex: none; accent-color: var(--accent); }
  button { font-size: .95rem; padding: 9px 24px; min-height: 40px; border-radius: 4px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; font-weight: 500; letter-spacing: .02em; cursor: pointer; }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button.sub { background: #fff; color: var(--accent); border-color: var(--line); }
  button.danger { background: #fff; color: var(--err); border-color: var(--line); }
  #attend button.on { box-shadow: 0 0 0 3px var(--accent-weak); font-weight: 700; }
  details.guide > summary { cursor: pointer; color: var(--accent); font-weight: 500; min-height: 32px; }
  details.guide h3 { font-size: .95rem; font-weight: 500; margin: 16px 0 4px; }
  details.guide p, details.guide li { font-size: .92rem; }
  details.guide ol, details.guide ul { padding-left: 1.3em; margin: 4px 0; }
  .emerg { border-left: 4px solid var(--err); background: var(--err-weak); padding: 10px 14px; border-radius: 4px; margin: 0 0 12px; font-size: .92rem; }
  textarea { width: 100%; font-size: 16px; padding: 8px; border: 1px solid var(--line); border-radius: 4px; font-family: inherit; min-height: 90px; }
  .late { color: var(--warn); font-weight: 500; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .submit-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
  .sending { color: var(--accent); font-size: .9rem; }
  .submit-area { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 4px 0 16px; }
  #submitBtn:disabled { background: #b39ddb; border-color: #b39ddb; opacity: .55; }
  .day { margin-top: 14px; }
  .day-title { font-weight: 500; font-size: .95rem; border-bottom: 1px solid var(--line); padding-bottom: 2px; margin-bottom: 8px; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .slot { background: #fff; color: var(--text); border: 1px solid var(--line); font-weight: 400; padding: 9px 8px; text-align: center; }
  .slot.on { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); font-weight: 500; }
  .slot small { display: block; color: var(--muted); font-weight: 400; font-size: .78rem; }
  .chosen { background: var(--accent-weak); border-radius: 4px; padding: 8px 12px; margin: 6px 0; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .chosen button { padding: 2px 12px; min-height: 44px; font-size: .85rem; white-space: nowrap; flex: none; }
  .note { color: var(--muted); font-size: .9rem; }
  .msg { border-radius: 8px; padding: 12px 14px; margin: 12px 0; white-space: pre-wrap; }
  .msg.err { background: var(--err-weak); color: var(--err); }
  .msg.warn { background: var(--warn-weak); color: var(--warn); }
  .msg.ok { background: #e6f4ea; color: var(--ok); }
  .done-title { font-size: 1.15rem; font-weight: 500; margin: 0 0 8px; }
  .plan-item { border-bottom: 1px solid var(--line); padding: 8px 0; }
  .plan-item .ng { color: var(--warn); font-weight: 700; }
  .badge { display: inline-block; font-size: .8rem; border-radius: 999px; padding: 0 8px; border: 1px solid var(--line); color: var(--muted); }
  .badge.rebook { border-color: var(--warn); color: var(--warn); }
  .ask { background: var(--warn-weak); border: 1px solid #f9d46c; border-radius: 8px; padding: 12px 14px; margin: 10px 0; }
  .ask p { margin: 0; font-weight: 500; }
  .tabs { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
  .tabs button { flex: 1; background: transparent; color: var(--muted); border: 0; border-bottom: 3px solid transparent; border-radius: 0;
    padding: 10px 6px; min-height: 46px; font-weight: 500; font-size: .9rem; }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs button:hover:not(.on) { background: #f8f9fa; filter: none; }
  .page-foot { text-align: center; color: var(--muted); font-size: .78rem; margin-top: 18px; }
  /* calendar picker (Picker.html) */
  .cal { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #fff; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-title { font-weight: 700; font-size: 1.05rem; }
  .cal-nav { background: #fff; color: var(--accent); border: 1px solid var(--line); width: 44px; height: 40px; min-height: 0; padding: 0; font-size: 1.4rem; line-height: 1; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-wd { text-align: center; font-size: .8rem; color: var(--muted); padding: 2px 0; }
  .cal-wd.sun, .cal-day.sun .cal-num { color: #c62828; }
  .cal-wd.sat, .cal-day.sat .cal-num { color: #1565c0; }
  .cal-day { min-height: 54px; border-radius: 6px; font-size: inherit; letter-spacing: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 4px 0; font-weight: 500; border: 1px solid transparent; background: transparent; color: var(--text); }
  .cal-day.off { opacity: .35; }
  .cal-day.blank { visibility: hidden; }
  .cal-day.open { background: var(--accent-weak); border-color: var(--accent-line); cursor: pointer; }
  .cal-day.open .cal-num { font-weight: 700; }
  .cal-day.sel { background: var(--accent); border-color: var(--accent); }
  .cal-day.sel .cal-num, .cal-day.sel .cal-cnt { color: #fff; }
  .cal-day.has-on:not(.sel) { border: 2px solid var(--accent); }
  .cal-num { font-size: 1rem; line-height: 1.2; }
  .cal-cnt { font-size: .68rem; color: var(--accent); line-height: 1.2; }
  .cal-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 8px; font-size: .78rem; color: var(--muted); }
  .cal-legend .lg { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--accent-line); background: var(--accent-weak); }
  .cal-legend .lg.sel { background: var(--accent); border-color: var(--accent); margin-left: 6px; }
  .cal-times { margin-top: 14px; }
  /* ★おすすめ: next to a booked session (first-come). Star + text, never colour alone */
  .slot.near { border: 2px solid var(--warn); }
  .slot.near.on { border-color: var(--accent); }
  .slot small.near-tag { color: var(--warn); font-weight: 700; }
  .cal-day.near:not(.sel) .cal-cnt { color: var(--warn); font-weight: 700; }
  .cal-legend .lg-star { color: var(--warn); font-weight: 700; margin-left: 6px; }
  /* what taking part brings (booking page) */
  .deadline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin: 14px 0 0; padding: 10px 12px;
    background: var(--accent-weak); border: 1px solid var(--accent-line); border-radius: 6px; }
  .deadline-title { font-weight: 700; color: var(--accent); }
  .deadline-when { font-weight: 700; font-size: 1.05rem; }
  .deadline-left { font-weight: 400; font-size: .9rem; color: var(--muted); margin-left: 2px; }
  .deadline-note { flex-basis: 100%; font-size: .85rem; color: var(--muted); }
  .deadline.soon { background: var(--warn-weak); border-color: #f6c26b; }
  .deadline.soon .deadline-title, .deadline.soon .deadline-left { color: var(--warn); }
  .benefits { border-left: 6px solid var(--ok); }
  .benefits h2 { margin: 0 0 8px; font-size: 1.05rem; }
  .benefits p { margin: 4px 0; }
  .benefits .benefit-item { padding-left: 1.1em; text-indent: -1.1em; }
  .benefits .benefit-item::before { content: '✓ '; color: var(--ok); font-weight: 700; }
  /* results (manage page) */
  .results { margin: 14px 0; }
  .res-item { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 10px 0; break-inside: avoid; }
  .res-name { font-weight: 700; }
  .res-value { font-size: 1.4rem; font-weight: 700; color: var(--accent); margin: 2px 0 6px; }
  .res-change { font-size: .9rem; color: var(--text); font-weight: 400; margin-left: 6px; }
  .res-hist { border-collapse: collapse; font-size: .85rem; margin: 4px 0 6px; }
  .res-hist th, .res-hist td { border: 1px solid var(--line); padding: 3px 8px; text-align: center; }
  .res-desc, .res-use { font-size: .9rem; margin: 4px 0; }
  .print-btn { margin-left: 8px; padding: 4px 12px; min-height: 0; }
  @media print {
    body { background: #fff; }
    .row, #picker, .print-btn, .page-foot, #info, #error { display: none !important; }
    .card { border: 0; padding: 0; }
  }
  /* honeypot: kept out of sight and out of the tab order */
  .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  details.wl { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 10px; }
  details.wl summary { cursor: pointer; color: var(--accent); font-weight: 500; }
  details.wl .slot small { color: var(--muted); }
  #emailHint .msg { margin-top: 8px; }
  .near-note { background: var(--warn-weak); color: var(--text); border-radius: 6px; padding: 8px 10px; font-size: .88rem; margin: 0 0 10px; }
  .cal-times .day-title { font-size: 1rem; }
  @media (max-width: 420px) { .cal { padding: 8px 6px; } .cal-grid { gap: 3px; } .cal-day { min-height: 48px; } .cal-cnt { font-size: .62rem; } }
  /* overall status (no names) */
  .st-sum { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .95rem; }
  .st-sum b { font-size: 1.15rem; color: var(--accent); }
  .st-day { margin-top: 12px; }
  .st-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .st-item { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 7px 10px;
    border-radius: 4px; border: 1px solid var(--line); font-size: .9rem; background: #fff; }
  .st-tag { font-size: .78rem; font-weight: 700; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .st-open .st-tag { color: var(--ok); background: #e9f6ec; }
  .st-full { background: #f1f3f4; }
  .st-full .st-tag { color: #fff; background: #5f6368; }
  .st-closed { opacity: .6; }
  .st-closed .st-tag { color: var(--muted); background: #f0f0f0; }
  .st-closed.st-has { opacity: 1; }
  @media (max-width: 420px) { .st-grid { grid-template-columns: repeat(2, 1fr); } .st-item { flex-direction: column; align-items: flex-start; gap: 2px; } }
  .name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  label.sub-label { font-weight: 400; font-size: .8rem; color: var(--muted); margin: 0; }
  .name-row + .name-row { margin-top: 14px; }
  .hidden { display: none; }
  /* honorarium form: search results, picked bank / branch, station chips, radio rows */
  .opt-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .opt { text-align: left; background: #fff; color: var(--text); border: 1px solid var(--line); font-weight: 400; padding: 8px 12px; }
  .opt small, .chip small { display: block; color: var(--muted); font-size: .78rem; }
  .picked { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--accent-weak); border-radius: 4px; padding: 8px 12px; margin-top: 6px; }
  .picked button { padding: 2px 12px; min-height: 44px; font-size: .85rem; flex: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
  .chip { background: #fff; color: var(--text); border: 1px solid var(--line); font-weight: 500; padding: 6px 12px; text-align: left; }
  .chip.on { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); }
  .radio-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .radio-row input[type=radio] { width: 20px; height: 20px; margin-top: 3px; flex: none; accent-color: var(--accent); }
  input[type=date], input[type=tel] { width: 100%; font-size: 16px; padding: 6px 0 5px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--text); outline: none; }
  input[type=date]:focus, input[type=tel]:focus { border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
  button:focus-visible, a:focus-visible, input[type=checkbox]:focus-visible, input[type=radio]:focus-visible, summary:focus-visible { outline: 3px solid var(--accent-line); outline-offset: 2px; }
  .submit-note { flex-basis: 100%; margin: 0; }
  .prenotes { margin: 12px 0 0; font-size: .9rem; }
  .prenotes summary { cursor: pointer; color: var(--accent); min-height: 32px; }
  .prenotes p { margin: 6px 0 0; }
  .privacy { margin: 6px 0 4px; padding-left: 1.2em; font-size: .88rem; }
  .privacy li { margin: 4px 0; }
  input[type=file] { font-size: .9rem; }
  .ok-text { color: var(--ok); font-weight: 500; }
  .spinner { color: var(--muted); padding: 12px 0; }
  a { color: var(--accent); }
  @media (max-width: 420px) { main { padding: 8px 8px 24px; } .card { padding: 18px 16px; } h1 { font-size: 1.45rem; } .slots { grid-template-columns: repeat(2, 1fr); } }
</style>
<script>
/**
 * Calendar-style slot picker shared by the booking and manage pages.
 * Month grid: days with open slots are highlighted with their count; tapping a day
 * lists that day's times underneath. Self-contained (no helpers from the pages).
 *
 * SlotPicker.render(container, slots, {
 *   isOn(slot) -> bool,          // highlighted times (selected / multi-select)
 *   onTap(slot),                 // time tapped
 *   state: {},                   // pass the same object across re-renders to keep month/day
 *   emptyText: '...',
 *   sub(slot) -> text,           // optional small line under a time (e.g. the examiner page)
 *   legend: '...',               // optional legend text for the highlighted days
 *   timesLabel: '...'            // optional heading after the day name (default 'の空き時間')
 * })
 * slots: [{id, date:'yyyy-MM-dd', startMin, endMin, remaining|null, near}]
 *   near = next to a booked session (first-come): marked ★おすすめ, and the first such day opens first
 */
var SlotPicker = (function () {
  var lastFocus = null;   // selector of the button tapped last, focused again after the redraw
  var WD = ['日', '月', '火', '水', '木', '金', '土'];

  function h(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hm(m) { return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function key(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function parts(k) { var p = k.split('-'); return { y: +p[0], m: +p[1] - 1, d: +p[2] }; }
  function dayLabel(k) {
    var p = parts(k), wd = new Date(p.y, p.m, p.d).getDay();
    return (p.m + 1) + '月' + p.d + '日（' + WD[wd] + '）';
  }

  function render(container, slots, opts) {
    opts = opts || {};
    var st = opts.state || (container._pickerState = container._pickerState || {});
    var byDay = {};
    slots.forEach(function (s) { (byDay[s.date] = byDay[s.date] || []).push(s); });
    var days = Object.keys(byDay).sort();
    if (!days.length) {
      container.innerHTML = '<p class="msg warn">' + h(opts.emptyText ||
        '選べる日時がありません。条件に合う日時が埋まっているか、締め切られました。') + '</p>';
      return;
    }
    var nearDays = days.filter(function (k) { return byDay[k].some(function (s) { return s.near; }); });
    // keep the chosen day if still available; else the day of a selected time; else the first
    // day with a recommended time; else the first open day
    if (!st.day || !byDay[st.day]) {
      var on = slots.filter(function (s) { return opts.isOn && opts.isOn(s); })[0];
      st.day = on ? on.date : (nearDays[0] || days[0]);
    }
    if (st.month == null) { var p0 = parts(st.day); st.year = p0.y; st.month = p0.m; }
    var first = parts(days[0]), last = parts(days[days.length - 1]);
    var minIdx = first.y * 12 + first.m, maxIdx = last.y * 12 + last.m;
    var curIdx = Math.min(Math.max(st.year * 12 + st.month, minIdx), maxIdx);
    st.year = Math.floor(curIdx / 12); st.month = curIdx % 12;

    var html = '<div class="cal" role="group" aria-label="日付を選ぶ">' +
      '<div class="cal-head">' +
      '<button type="button" class="cal-nav" data-nav="-1" aria-label="前の月"' + (curIdx <= minIdx ? ' disabled' : '') + '>‹</button>' +
      '<div class="cal-title">' + st.year + '年' + (st.month + 1) + '月</div>' +
      '<button type="button" class="cal-nav" data-nav="1" aria-label="次の月"' + (curIdx >= maxIdx ? ' disabled' : '') + '>›</button>' +
      '</div><div class="cal-grid">';
    WD.forEach(function (w, i) { html += '<div class="cal-wd' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') + '">' + w + '</div>'; });
    var lead = new Date(st.year, st.month, 1).getDay();
    var n = new Date(st.year, st.month + 1, 0).getDate();
    var cells = [];
    for (var b = 0; b < lead; b++) cells.push({ html: '<div class="cal-day blank"></div>', open: false });
    for (var d = 1; d <= n; d++) {
      var k = key(st.year, st.month, d);
      var list = byDay[k] || [];
      var wd = (lead + d - 1) % 7;
      var cls = 'cal-day' + (wd === 0 ? ' sun' : wd === 6 ? ' sat' : '');
      if (!list.length) { cells.push({ html: '<div class="' + cls + ' off" aria-hidden="true"><span class="cal-num">' + d + '</span></div>', open: false }); continue; }
      var picked = list.filter(function (s) { return opts.isOn && opts.isOn(s); }).length;
      var near = nearDays.indexOf(k) >= 0;
      cls += ' open' + (k === st.day ? ' sel' : '') + (picked ? ' has-on' : '') + (near ? ' near' : '');
      cells.push({ open: true, html: '<button type="button" class="' + cls + '" data-day="' + k + '" aria-pressed="' + (k === st.day) + '" aria-label="' +
        h(dayLabel(k) + ' 空き' + list.length + '枠' + (near ? '・おすすめあり' : '') + (picked ? '・選択' + picked : '')) + '">' +
        '<span class="cal-num">' + d + '</span><span class="cal-cnt">' + (picked ? '✓' + picked : (near ? '★' : '') + list.length + '枠') + '</span></button>' });
    }
    // weeks before the first / after the last open day are dropped so the times stay near the top on phones
    var rows = [];
    for (var r = 0; r < cells.length; r += 7) rows.push(cells.slice(r, r + 7));
    var hasOpen = function (row) { return row.some(function (c) { return c.open; }); };
    var firstOpen = 0, lastOpen = rows.length - 1;
    while (firstOpen < lastOpen && !hasOpen(rows[firstOpen])) firstOpen++;
    while (lastOpen > firstOpen && !hasOpen(rows[lastOpen])) lastOpen--;
    rows.slice(firstOpen, lastOpen + 1).forEach(function (row) { row.forEach(function (c) { html += c.html; }); });
    html += '</div><div class="cal-legend"><span class="lg open"></span>' + h(opts.legend || '予約できる日（数字は空き枠）') + '<span class="lg sel"></span>表示中の日' +
      (nearDays.length ? '<span class="lg-star">★</span>おすすめの時間がある日' : '') + '</div></div>';

    var times = byDay[st.day] || [];
    var dayNear = times.some(function (s) { return s.near; });
    html += '<div class="cal-times"><div class="day-title">' + h(dayLabel(st.day)) + ' ' + h(opts.timesLabel || 'の空き時間') + '</div>' +
      (dayNear ? '<p class="near-note">★おすすめ＝ほかの方の予約の直前・直後の時間です。ご都合が合えば、こちらを優先して選んでいただけると助かります（実験機材の準備・片付けをまとめられるため）。</p>' : '') +
      '<div class="slots">' +
      times.map(function (s) {
        var on = opts.isOn && opts.isOn(s);
        return '<button type="button" class="slot' + (on ? ' on' : '') + (s.near ? ' near' : '') + '" data-id="' + h(s.id) + '" aria-pressed="' + !!on + '">' +
          (on ? '✓ ' : '') + hm(s.startMin) + '〜' + hm(s.endMin) + (s.near ? '<small class="near-tag">★おすすめ</small>' : '') +
          (s.remaining != null ? '<small>残り' + Number(s.remaining) + '</small>' : '') +
          (opts.sub && opts.sub(s) ? '<small>' + h(opts.sub(s)) + '</small>' : '') + '</button>';
      }).join('') + '</div></div>';
    container.innerHTML = html;
    // the redraw replaces the buttons: put focus back on the one just used (keyboard and screen readers)
    if (lastFocus) {
      var again = container.querySelector(lastFocus);
      if (again && again.focus) { try { again.focus({ preventScroll: true }); } catch (e) { again.focus(); } }
      lastFocus = null;
    }

    Array.prototype.forEach.call(container.querySelectorAll('.cal-nav'), function (btn) {
      btn.onclick = function () {
        lastFocus = '.cal-nav[data-nav="' + btn.getAttribute('data-nav') + '"]';
        var idx = st.year * 12 + st.month + Number(btn.getAttribute('data-nav'));
        st.year = Math.floor(idx / 12); st.month = idx % 12;
        // jump the shown day to the first open day of the new month
        var pre = key(st.year, st.month, 1).slice(0, 8);
        var inMonth = days.filter(function (x) { return x.slice(0, 8) === pre; });
        if (inMonth.length) st.day = inMonth[0];
        render(container, slots, Object.assign({}, opts, { state: st }));
      };
    });
    Array.prototype.forEach.call(container.querySelectorAll('.cal-day.open'), function (btn) {
      btn.onclick = function () {
        st.day = btn.getAttribute('data-day');
        lastFocus = '.cal-times .slot';   // the first time of the chosen day
        render(container, slots, Object.assign({}, opts, { state: st }));
        var t = container.querySelector('.cal-times');
        if (t && t.scrollIntoView) t.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      };
    });
    Array.prototype.forEach.call(container.querySelectorAll('.cal-times .slot'), function (btn) {
      btn.onclick = function () {
        lastFocus = '.slot[data-id="' + btn.getAttribute('data-id') + '"]';
        var s = times.filter(function (x) { return x.id === btn.getAttribute('data-id'); })[0];
        if (s && opts.onTap) opts.onTap(s, btn);
      };
    });
  }

  return { render: render, dayLabel: dayLabel, hm: hm };
})();

/**
 * The 回答期限 box shared by the booking, manage and examiner pages.
 * DeadlineBox.html({title, label, ms, note, after}) -> html ('' when there is nothing to show).
 * label '' = no fixed date (note only); ms counts down; after = note once the deadline has passed.
 * Within 48 hours (or past) the box turns orange.
 */
var DeadlineBox = (function () {
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function left(ms) {
    var m = Math.floor(ms / 60000);
    if (m < 60) return 'あと' + Math.max(m, 1) + '分';
    var h = Math.floor(m / 60);
    return h < 48 ? 'あと' + h + '時間' : 'あと' + Math.floor(h / 24) + '日';
  }
  function html(d, now) {
    if (!d || (!d.label && !d.note)) return '';
    now = now || Date.now();
    var past = !!d.ms && now >= d.ms;
    var soon = !!d.ms && (past || d.ms - now < 48 * 3600000);
    var out = '<div class="deadline' + (soon ? ' soon' : '') + '" role="note"><span class="deadline-title">' + esc(d.title || '回答期限') + '</span>';
    if (d.label) out += '<span class="deadline-when">' + esc(d.label) + (past ? '（終了）' : d.ms ? '<span class="deadline-left" data-ms="' + Number(d.ms) + '">（' + left(d.ms - now) + '）</span>' : '') + '</span>';
    var note = past && d.after ? d.after : d.note;
    if (note) out += '<span class="deadline-note">' + esc(note) + '</span>';
    return out + '</div>';
  }
  // a page left open keeps an honest countdown
  if (typeof document !== 'undefined' && typeof setInterval === 'function') {
    setInterval(function () {
      Array.prototype.forEach.call(document.querySelectorAll('.deadline-left[data-ms]'), function (el) {
        var ms = Number(el.getAttribute('data-ms')) - Date.now();
        el.textContent = ms > 0 ? '（' + left(ms) + '）' : '（終了）';
      });
    }, 60000);
  }
  return { html: html, left: left };
})();
</script>

function askTemplate(id) {
  var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 30000) : null;
  return fetch('https://script.google.com/macros/s/' + TEMPLATE_DEPLOYMENT + '/exec', {
    method: 'POST', credentials: 'omit', redirect: 'follow', cache: 'no-store',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: 'apiKnownDeployment', args: [id] }),

  }).then(function (r) { if (timer) clearTimeout(timer); return r.text(); }).then(function (t) {
    var j = JSON.parse(t);
    if (!j.ok) throw new Error(j.error);
    return !!j.result.known;
  });
}
var API_URL = 'https://script.google.com/macros/s/' + DEPLOYMENT + '/exec';

/** Manage links always point back to this page, whatever the server builds. */
function localManageUrl(serverUrl) {
  var m = String(serverUrl || '').match(/[?&]m=([A-Za-z0-9]+)/);
  var u = location.origin + location.pathname + '?x=' + encodeURIComponent(DEPLOYMENT);
  return m ? u + '&m=' + m[1] : u;
}

function start(tplId, code) {

}

g').innerHTML = '<div class=\"msg err\">' + esc(e.message || e) + '<\/div>'; btn.disabled = false; });\n  };\n}\n\n// ---- repeat block\n\nfunction renderRepeatChooser() {\n  var preIds = chosen.map(function (c) { return c.id; });\n  $('picker').innerHTML = '<p class=\"spinner\">候補を探しています…<\/p>';\n  var mine = ++drawSeq;\n  call('apiRepeatChoices', preIds).then(function (r) {\n    if (mine !== drawSeq) return;\n    if (!r.weeks.length || !r.patterns.length) { $('picker').innerHTML = '<p class=\"msg warn\">繰り返しの日程を組める期間が残っていません。研究者へご連絡ください。<\/p>'; return; }\n    var html = '<p><b>毎週の日時<\/b>を選んでください（週' + Number(P.repeat.perWeek) + '回 × ' + Number(P.repeat.weeks) + '週）<\/p>' +\n      '<label for=\"weekSel\">開始する週<\/label><select id=\"weekSel\">' +\n      r.weeks.map(function (w) { return '<option value=\"' + esc(w.monday) + '\">' + esc(w.label) + '<\/option>'; }).join('') + '<\/select>' +\n      '<label>曜日と時刻（' + Number(P.repeat.perWeek) + 'つ選ぶ）<\/label><div class=\"slots\" id=\"patGrid\">' +\n      r.patterns.map(function (p, k) {\n        return '<button type=\"button\" class=\"slot\" data-k=\"' + k + '\">' + esc(p.label) + '<\/button>';\n      }).join('') + '<\/div>' +\n      '<p class=\"note\">同じ週の中は' + Number(P.repeat.minGap) + '日以上あけてください。合わない週は次の画面で個別に振り替えられます。<\/p>' +\n      '<div class=\"row\"><button type=\"button\" id=\"planBtn\" disabled>この曜日・時刻で日程を組む<\/button><\/div><div id=\"planBox\"><\/div>';\n    $('picker').innerHTML = html;\n    var picked = [];\n    Array.prototype.forEach.call(document.querySelectorAll('#patGrid .slot'), function (b) {\n      b.onclick = function () {\n        var k = Number(b.getAttribute('data-k'));\n        var at = picked.indexOf(k);\n        if (at >= 0) picked.splice(at, 1); else if (picked.length < P.repeat.perWeek) picked.push(k);\n        Array.prototype.forEach.call(document.querySelectorAll('#patGrid .slot'), function (x) {\n          x.classList.toggle('on', picked.indexOf(Number(x.getAttribute('data-k'))) >= 0);\n        });\n        $('planBtn').disabled = picked.length !== P.repeat.perWeek;\n      };\n    });\n    $('planBtn').onclick = function () {\n      var pats = picked.map(function (k) { return { weekday: r.patterns[k].weekday, startMin: r.patterns[k].startMin }; });\n      var monday = $('weekSel').value;\n      $('planBox').innerHTML = '<p class=\"spinner\">日程を組んでいます…<\/p>';\n      call('apiRepeatPlan', preIds, monday, pats).then(function (plan) {\n        repeatState = { preIds: preIds, plan: plan, blockIds: plan.map(function (p) { return p.available ? p.id : ''; }), labels: plan.map(function (p) { return p.available ? p.label : ''; }) };\n        renderPlan();\n      }).catch(fail);\n    };\n  }).catch(fail);\n}\n\nfunction renderPlan() {\n  var rs = repeatState;\n  var html = '<div>';\n  rs.plan.forEach(function (p, k) {\n    html += '<div class=\"plan-item\">第' + (p.week + 1) + '週：';\n    if (p.available) {\n      html += esc(p.label) + ' ✓';\n    } else {\n      var used = rs.blockIds.filter(function (id, j) { return id && j !== k; });\n      var alts = (p.alternatives || []).filter(function (a) { return used.indexOf(a.id) < 0; });\n      html += '<span class=\"ng\">' + esc(p.label) + ' は空いていません<\/span>' +\n        (alts.length ? '<select data-k=\"' + k + '\"><option value=\"\">— 同じ週の別の日時を選ぶ —<\/option>' +\n          alts.map(function (a) { return '<option value=\"' + esc(a.id) + '\"' + (rs.blockIds[k] === a.id ? ' selected' : '') + '>' + (a.near ? '★おすすめ ' : '') + esc(a.label) + '<\/option>'; }).join('') +\n          '<\/select>' : '<div class=\"msg warn\">この週は空きがありません。開始する週か曜日・時刻を変えてください。<\/div>');\n    }\n    html += '<\/div>';\n  });\n  html += '<\/div><div class=\"row\"><button type=\"button\" id=\"planOk\">この日程で進む<\/button><\/div>';\n  $('planBox').innerHTML = html;\n  Array.prototype.forEach.call(document.querySelectorAll('#planBox select'), function (s) {\n    s.onchange = function () {\n      var k = Number(s.getAttribute('data-k'));\n      rs.blockIds[k] = s.value;\n      rs.labels[k] = s.value ? s.options[s.selectedIndex].text.replace(/^★おすすめ /, '') : '';\n      renderPlan();\n    };\n  });\n  var complete = rs.blockIds.every(Boolean);\n  $('planOk').disabled = !complete;\n  $('planOk').onclick = function () {\n    var base = chosen.length;\n    rs.blockIds.forEach(function (id, k) { chosen[base + k] = { id: id, label: rs.labels[k] }; });\n    renderSeriesStep(chosen.length);\n  };\n}\n\n// ---- preference mode\n\nfunction renderPreference(i) {\n  drawSeq++;\n  var n = P.labels.length;\n  var title = '<p>' + (P.labels[i] ? '<b>' + esc(P.labels[i]) + '<\/b>：' : '') + '都合のよい日時をすべてタップ' + (n > 1 ? '（' + (i + 1) + '/' + n + '）' : '') + '<br>' +\n    '<span class=\"note\">日付をタップすると、その日の時間が出ます。いくつ選んでも構いません。<\/span><\/p>';\n  var calState = {};   // keep the shown month/day while toggling times\n  // the calendar stays on screen; the send button below takes over once every session has picks\n  $('picker').innerHTML = title + '<div id=\"cal\"><\/div><p class=\"note\" id=\"prefCount\"><\/p>' +\n    (n > 1 ? '<div class=\"row\">' + (i > 0 ? '<button type=\"button\" class=\"sub\" id=\"prevBtn\">前の回へ<\/button>' : '') +\n      (i + 1 < n ? '<button type=\"button\" id=\"nextBtn\">次の回へ<\/button>' : '') + '<\/div>' : '');\n  if ($('prevBtn')) $('prevBtn').onclick = function () { renderPreference(i - 1); };\n  if ($('nextBtn')) $('nextBtn').onclick = function () { renderPreference(i + 1); };\n  function draw() {\n    SlotPicker.render($('cal'), P.slots, {\n      state: calState,\n      isOn: function (s) { return prefs[i].indexOf(s.id) >= 0; },\n      onTap: function (s) {\n        var at = prefs[i].indexOf(s.id);\n        if (at >= 0) prefs[i].splice(at, 1); else prefs[i].push(s.id);\n        draw();\n      }\n    });\n    $('prefCount').textContent = '選んだ候補：' + prefs[i].length + '件';\n    if ($('nextBtn')) $('nextBtn').disabled = !prefs[i].length;\n    renderPrefList(i);\n    renderSummary();\n  }\n  draw();\n}\n\n/** With several { fail({ message: '「確認」の欄にチェックを入れてください。' }); return; }\n  if (P.honorarium) payload.honorarium = honorPayload();\n  // an address that clearly does not exist gets one warning before sending (sending stays possible)\n  if (P.honorarium && !H.addressOk) {\n    var btn = this;\n    busy(true);\n    $('sendingNote').textContent = '住所を確認しています…';\n    call('apiCheckAddress', $('hZip').value, $('hAddress').value).then(function (r) {\n      busy(false);\n      $('sendingNote').textContent = '送信中です。10秒ほどかかります。画面を閉じずにお待ちください。';\n      if (!r.issues.length) { H.addressOk = true; btn.onclick(); return; }\n      askInline($('confirm'), '郵便番号・住所をご確認ください：\\n' + r.issues.join('\\n') + '\\n正しければ、このまま送信できます。', 'このまま送信', '住所を直す',\n        function () { H.addressOk = true; btn.onclick(); }, function () { $('hZip').scrollIntoView({ block: 'center', behavior: 'smooth' }); });\n    }).catch(function () { busy(false); H.addressOk = true; btn.onclick(); });\n    return;\n  }\n  busy(true);\n  var req = P.bookingMode === 'preference'\n    ? call('apiSubmitPreferences', Object.assign(payload, { choices: prefs }))\n    : call('apiBook', Object.assign(payload, { ids: chosen.map(function (c) { return c.id; }) }));\n  req.then(function (r) {\n    ['benefits', 'profile', 'choose', 'honor', 'confirm'].forEach(function (id) { show(id, false); });\n    clearDraft();\n    var html = '<p class=\"done-title\">回答を記録しました<\/p>' +\n      '<div class=\"msg ok\">' + (P.bookingMode === 'preference' ? '希望を受け付けました。' + (r.deadlineLabel ? r.deadlineLabel + 'の締切のあと、' : '') + '日時が決まったらメールでお知らせします。' : '予約が確定しました。確認メールをお送りしました。') + '<\/div>' +\n      '<ul>' + r.items.map(function (x) { return '<li>' + esc(x) + '<\/li>'; }).join('') + '<\/ul>' +\n      (P.honorarium ? '<p class=\"note\">謝金の振込に必要な情報も受け付けました。<\/p>' : '') +\n      '<p>予約の確認・取消・変更は、確認メールのリンクか次のページから行えます' + (P.cancelLeadHours ? '（開始の' + Number(P.cancelLeadHours) + '時間前まで）' : '') + '。<br><a href=\"' + esc(localManageUrl(r.manageUrl)) + '\">予約の確認ページ<\/a><\/p>' +\n      (P.mapUrl ? '<p><a href=\"' + esc(P.mapUrl) + '\" target=\"_blank\" rel=\"noopener\">場所の地図を開く<\/a><\/p>' : '') +\n      (P.preNotes ? '<div class=\"msg warn\"><b>測定前のお願い・持ち物<\/b><br>' + esc(P.preNotes).replace(/\\n/g, '<br>') + '<\/div>' : '') +\n      '<p class=\"note\">確認メールが数分たっても届かない場合は、迷惑メールフォルダもご確認ください。<\/p>';\n    if (r.lineCode) html += '<p class=\"msg warn\">LINEでもリマインドを受け取る場合は、' + (r.lineAddUrl ? '<a href=\"' + esc(r.lineAddUrl) + '\" target=\"_blank\" rel=\"noopener\">公式アカウントを友だち追加<\/a>し、' : '公式アカウントに') + '次のコードを送ってください：<b>' + esc(r.lineCode) + '<\/b><\/p>';\n    $('done').innerHTML = html;\n    show('done', true);\n    loadStatus();\n    window.scrollTo(0, 0);\n  }).catch(function (e) {\n    if (e && e.lost) {\n      // the request may have gone through even though the answer never came back\n      fail({ message: '通信が途中で切れました。予約が完了している場合は、確認メールが届きます。数分たっても届かない場合は、「予約済みの方」タブでリンクの再送を試してから、必要ならもう一度送信してください。' });\n      return;\n    }\n    fail(e);\n    if (/受付は終了|募集人数に達し/.test((e && e.message) || '')) {\n      ['profile', 'choose', 'honor', 'confirm', 'benefits'].forEach(function (id) { show(id, false); });\n      return;\n    }\n    // availability may have changed: reload the options from the first unchanged step\n    if (/埋まった|締め切られ|いっぱい/.test(e.message || '')) {\n      var kept = prefs;\n      call('apiGetPage').then(function (p) {\n        P = p;\n        startChoose();\n        // preference mode: keep the picks that are still open instead of starting from nothing\n        if (P.bookingMode === 'preference' && kept.length === P.labels.length) {\n          var open = {};\n          P.slots.forEach(function (s) { open[s.id] = true; });\n          prefs = kept.map(function (list) { return list.filter(function (id) { return open[id]; }); });\n          renderPreference(0);\n        }\n      });\n    }\n  });\n};\n\nfunction submitHonorOnly(btn) {\n  if (!H.addressOk) {\n    busy(true);\n    $('sendingNote').textContent = '住所を確認しています…';\n    call('apiCheckAddress', $('hZip').value, $('hAddress').value).then(function (r) {\n      busy(false);\n      $('sendingNote').textContent = '送信中です。10秒ほどかかります。画面を閉じずにお待ちください。';\n      if (!r.issues.length) { H.addressOk = true; submitHonorOnly(btn); return; }\n      askInline($('confirm'), '郵便番号・住所をご確認ください：\\n' + r.issues.join('\\n') + '\\n正しければ、このまま送信できます。', 'このまま送信', '住所を直す',\n        function () { H.addressOk = true; submitHonorOnly(btn); }, function () { $('hZip').scrollIntoView({ block: 'center', behavior: 'smooth' }); });\n    }).catch(function () { busy(false); H.addressOk = true; submitHonorOnly(btn); });\n    return;\n  }\n  busy(true);\n  call('apiSubmitHonorarium', HON_TOKEN, honorPayload()).then(function () {\n    ['honor', 'confirm'].forEach(function (id) { show(id, false); });\n    $('done').innerHTML = '<p class=\"done-title\">回答を記録しました<\/p><div class=\"msg ok\">謝金の振込に必要な情報を受け付けました。ありがとうございました。<\/div>';\n    show('done', true);\n    clearDraft();\n    window.scrollTo(0, 0);\n  }).catch(function (e) {\n    if (!(e && e.lost)) { fail(e); return; }\n    // the answer was lost: ask the server whether it arrived instead of inviting a second send\n    call('apiHonorariumForm', HON_TOKEN).then(function (d) {\n      busy(false);\n      if (d.done) {\n        ['honor', 'confirm'].forEach(function (id) { show(id, false); });\n        $('done').innerHTML = '<p class=\"done-title\">回答を記録しました<\/p><div class=\"msg ok\">通信は途中で切れましたが、謝金の振込に必要な情報は受け付けています。ありがとうございました。<\/div>';\n        show('done', true);\n        clearDraft();\n        window.scrollTo(0, 0);\n      } else fail({ message: '通信が途中で切れたため、受け付けられませんでした。もう一度送信してください。' });\n    }).catch(function () { fail(e); });\n  });\n}\n\n// ---------------------------------------------------------------- honorarium (謝金申請)\n\n/** Inline question under an element (some in-app browsers suppress window.confirm). */\nfunction askInline(anchor, text, yesLabel, noLabel, onYes, onNo) {\n  Array.prototype.forEach.call(document.querySelectorAll('.ask'), function (el) { el.remove(); });\n  var box = document.createElement('div');\n  box.className = 'ask';\n  box.innerHTML = '<p style=\"white-space:pre-wrap\">' + esc(text) + '<\/p><div class=\"row\"><button type=\"button\" class=\"yes\">' + esc(yesLabel) +\n    '<\/button><button type=\"button\" class=\"sub no\">' + esc(noLabel) + '<\/button><\/div>';\n  anchor.parentNode.insertBefore(box, anchor);\n  box.querySelector('.yes').onclick = function () { box.remove(); onYes(); };\n  box.querySelector('.no').onclick = function () { box.remove(); if (onNo) onNo(); };\n  box.scrollIntoView({ block: 'center', behavior: 'smooth' });\n}\n\nvar H = { bank: null, branch: null, branches: [], photoId: '', check: null, checking: false, zipFilled: '', stationsFor: '', unreadableIds: [] };\n/** A photo the page could not read: remembered so that one retake is asked for, then sending is allowed. */\nfunction noteUnreadable() {\n  if (H.photoId && H.check && H.check.status === 'unreadable' && H.unreadableIds.indexOf(H.photoId) < 0) H.unreadableIds.push(H.photoId);\n}\nfunction needRetake() { return !!(H.check && H.check.status === 'unreadable' && H.unreadableIds.length < 2); }\nfunction digits(v) { return String(v || '').replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/\\D/g, ''); }\nfunction toKatakanaJs(v) { return String(v || '').replace(/\\s+/g, '').replace(/[ぁ-ゖ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) + 0x60); }); }\nfunction radio(name) { var r = document.querySelector('input[name=\"' + name + '\"]:checked'); return r ? r.value : ''; }\nfunction isYucho() { return H.bank && H.bank.code === '9900'; }\n/** 楽天 → 楽天銀行, but 城南信用金庫 / 本店 / 日吉出張所 keep their own ending. */\nfunction bankLabel(name) { return /(銀行|信用金庫|信用組合|労働金庫|農業協同組合|漁業協同組合|信金|信組|労金|農協|漁協|信連|信漁連|金庫|組合)$/.test(name) ? name : name + '銀行'; }\nfunction branchLabel(name) { return /(店|出張所|営業部|支所|事務所|センター)$/.test(name) ? name : name + '支店'; }\nvar debounce = function (fn, ms) { var t = null; return function () { clearTimeout(t); t = setTimeout(fn, ms); }; };\n\nfunction ageFromBirth(b) {\n  var m = String(b || '').match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);\n  if (!m) return NaN;\n  var now = new Date(), a = now.getFullYear() - (+m[1]);\n  if (now.getMonth() + 1 < +m[2] || (now.getMonth() + 1 === +m[2] && now.getDate() < +m[3])) a--;\n  return a;\n}\n\nfunction honorMissing() {\n  var m = [];\n  if (digits($('hZip').value).length !== 7) m.push('自宅郵便番号');\n  if ($('hAddress').value.trim().length < 6 || !/[0-9０-９一二三四五六七八九十丁番]/.test($('hAddress').value)) m.push('自宅住所（番地まで）');\n  if (!$('hStation').value.trim()) m.push('最寄駅名');\n  var ph = digits($('hPhone').value);\n  if (!/^0\\d{9,10}$/.test(ph)) m.push('携帯番号');\n  var a = ageFromBirth($('hBirth').value);\n  if (isNaN(a)) m.push('生年月日');\n  else if (Number($('age').value) > 0 && a !== Number($('age').value)) m.push('生年月日（年齢と合いません）');\n  var aff = radio('hAff');\n  if (!aff) m.push('所属');\n  else {\n    if (!$('hFaculty').value.trim()) m.push(aff === 'external' ? '所属先' : '所属学部（研究科）');\n    if (!$('hPosition').value.trim()) m.push(aff === 'external' ? '職位' : '学年');\n    // full-width digits from a Japanese keyboard are fine (the server reads them the same way)\n    if (aff !== 'external' && !/^[0-9A-Za-z]{4,12}$/.test($('hNumber').value.normalize('NFKC').trim())) m.push('学籍番号（教職員番号）');\n  }\n  if (!H.bank) m.push('振込先の銀行');\n  else if (isYucho()) {\n    if (!/^1\\d{3}0$/.test(digits($('hKigou').value)) || !/^\\d{2,8}$/.test(digits($('hBangou').value))) m.push('ゆうちょ銀行の記号・番号');\n    else if (digits($('hBangou').value) !== digits($('hBangou2').value)) m.push('確認用の番号（一致していません）');\n  } else {\n    if (!H.branch) m.push('振込先の支店');\n    if (!/^\\d{1,7}$/.test(digits($('hAccount').value))) m.push('口座番号');\n    else if (digits($('hAccount').value) !== digits($('hAccount2').value)) m.push('確認用の口座番号（一致していません）');\n  }\n  if (!H.photoId) m.push('通帳またはキャッシュカードの写真');\n (c.status === 'ok') { el.textContent = '✓ 写真の番号と入力が一致しました。'; el.className = 'note ok-text'; return; }\n  if (c.status === 'unreadable' && needRetake()) {\n    el.className = 'msg err';\n    el.textContent = '写真から数字を読み取れませんでした。銀行名・支店番号・口座番号がはっきり写るように、明るい場所で真上から撮り直して、もう一度添付してください（撮り直すまで送信できません）。';\n    return;\n  }\n  if (c.status === 'unreadable') { el.className = 'msg warn'; el.textContent = '撮り直した写真からも数字を読み取れませんでした。このまま送信できます（研究者が写真を目で確認します）。'; return; }\n  el.className = 'msg err';\n  el.textContent = '写真の' + (c.what === 'branch' ? (isYucho() ? '記号' : '支店番号') : (isYucho() ? '番号' : '口座番号')) + '（読み取り：' + c.read.join('・') +\n    '）と入力が一致しません。入力を確かめるか、数字がはっきり写った写真を選び直してください。';\n}\n\nvar recheck = debounce(function () {\n  if (!H.photoId) return;\n  H.checking = true; showPhotoState(); updateSubmit();\n  call('apiCheckBankPhoto', H.photoId, want()).then(function (c) { H.check = c; noteUnreadable(); }).catch(function () { H.check = null; })\n    .then(function () { H.checking = false; showPhotoState(); updateSubmit(); });\n}, 600);\n\nfunction renderHolder() {\n  var name = ($('familyName').value.trim() + ' ' + $('givenName').value.trim()).trim();\n  var kana = (toKatakanaJs($('familyKana').value) + ' ' + toKatakanaJs($('givenKana').value)).trim();\n  $('hHolder').textContent = name ? '口座名義：' + name + '（' + kana + '）' : '';\n}\n\nfunction pickBank(b) {\n  H.bank = b; H.branch = null; H.branches = [];\n  $('hBankList').innerHTML = '';\n  $('hBankQ').value = '';\n  show('hBankQ', false);\n  $('hBankPicked').innerHTML = '<span>' + esc(bankLabel(b.name)) + '（' + esc(b.kana) + '・' + esc(b.code) + '）<\/span><button type=\"button\" class=\"sub\" id=\"hBankChange\">変更<\/button>';\n  show('hBankPicked', true);\n  $('hBankChange').onclick = function () { H.bank = null; H.branch = null; show('hBankPicked', false); show('hBankQ', true); show('hBranchBox', false); show('hYuchoBox', false); $('hBankQ').focus(); recheck(); updateSubmit(); };\n  show('hYuchoBox', isYucho());\n  show('h ped > 0 && typed !== a ? '生年月日からは ' + a + '歳です。上の年齢と合っていません。' : '');\n  updateSubmit();\n});\n\nArray.prototype.forEach.call(document.querySelectorAll('input[name=\"hAff\"]'), function (r) {\n  r.addEventListener('change', function () {\n    var ext = radio('hAff') === 'external';\n    show('staffNote', radio('hAff') === 'staff');\n    $('hFacultyLabel').textContent = ext ? '所属先（会社名・学校名など）' : radio('hAff') === 'staff' ? '所属（学部・研究科・部署）' : '所属学部（または研究科）';\n    $('hPositionLabel').textContent = ext ? '職位' : radio('hAff') === 'staff' ? '職位' : '学年（大学院生は課程と学年）';\n    $('hNumberLabel').textContent = radio('hAff') === 'staff' ? '教職員番号' : '学籍番号';\n    show('hNumberBox', !ext);\n    show('hAffBox', true);\n    updateSubmit();\n  });\n});\nArray.prototype.forEach.call(document.querySelectorAll('input[name=\"hCover\"]'), function (r) { r.addEventListener('change', updateSubmit); });\nArray.prototype.forEach.call(document.querySelectorAll('input[name=\"hPass\"]'), function (r) {\n  r.addEventListener('change', function () { $('hCampus').textContent = (P && P.campusStation) || '日吉'; show('hPassBox', radio('hPass') === 'yes'); updateSubmit(); });\n});\n\n['hAddress', 'hStation', 'hPhone', 'hFaculty', 'hPosition', 'hNumber', 'hAccount2', 'hBangou2', 'hPassFrom', 'hPassTo'].forEach(function (id) {\n  $(id).addEventListener('input', updateSubmit);\n});\n['hAccount', 'hKigou', 'hBangou'].forEach(function (id) {\n  $(id).addEventListener('input', function () {\n    if (isYucho()) {\n      var k = digits($('hKigou').value), n = digits($('hBangou').value);\n      $('hYuchoNote').textContent = /^1\\d{3}0$/.test(k) && /^\\d{2,8}$/.test(n) && ('00000000' + n).slice(-1) === '1'\n        ? '振込用：店名 ' + k.charAt(1) + k.charAt(2) + '8 ／ 口座番号 ' + ('00000000' + n).slice(-8, -1) : '';\n    }\n    recheck(); updateSubmit();\n  });\n});\n['familyName', 'givenName', 'familyKana', 'givenKana'].forEach(function (id) { $(id).addEventListener('input', renderHolder); });\n\n/** Shrink the photo on the phone (max 1600 px, JPEG) before sending it. */\nfunction shrinkPhoto(file) {\n  return new Promise(function (resolve, reject) {\n    var url = URL.createObjectURL(file);\n    var img = new Image();\n    img.onload = function () {\n      var scale = Math.min(1, 1600 / Math.max(img.width, img.height));\n      var cv = document.createElement('canvas');\n      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);\n      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);\n      URL.revokeObjectURL(url);\n      resolve(cv.toDataURL('image/jpeg', 0.85));\n    };\n    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('この写真は読み込めません。JPEGかPNGの写真を選んでください。')); };\n    img.src = url;\n  });\n}\n$('hPhoto').addEventListener('change', function () {\n  var f = $('hPhoto').files[0];\n  if (!f) return;\n  H.photoId = ''; H.check = null; H.checking = true;\n  $('hPhotoState').className = 'note';\n  $('hPhotoState').textContent = '写真を送っています…（10秒ほど）';\n  updateSubmit();\n  shrinkPhoto(f).then(function (dataUrl) { return call('apiUploadBankPhoto', dataUrl, want()); }).then(function (r) {\n    H.photoId = r.photoId; H.check = r.check;\n    noteUnreadable();\n  }).catch(function (e) { H.photoId = ''; $('hPhoto').value = ''; $('hPhotoState').className = 'msg err'; $('hPhotoState').textContent = (e && e.message) || String(e); })\n    .then(function () {\n      H.checking = false;\n      if (H.photoId) showPhotoState();\n      updateSubmit();\n      // an unreadable photo is pointed out where the participant is looking\n      if (needRetake()) { $('hPhotoState').scrollIntoView({ block: 'center', behavior: 'smooth' }); $('hPhoto').value = ''; }\n    });\n});\n\n$('resendBtn').onclick = function () {\n  if (!emailOk($('resendEmail').value)) { $('resendMsg').innerHTML = '<div class=\"msg err\">メールアドレスの形を確認してください。<\/div>'; return; }\n  $('resendBtn').disabled = true;\n  call('apiResend', $('resendEmail').value).then(function () {\n    $('resendMsg').innerHTML = '<div class=\"msg ok\">登録があれば、そのアドレスにリンクを送りました。届かない場合は迷惑メールフォルダもご確認ください。<\/div>';\n  }).catch(fail).then(function () { $('resendBtn').disabled = false; });\n};\n");

function refuse() {
  // never send anything to a web app that is not one of the lab's: the link may have been made by someone else
  document.getElementById('app').innerHTML = '<main><div class="msg err">このリンクの予約ページは使えません（登録されていない実験です）。お名前などは入力せず、案内を送ってきた研究者に直接お問い合わせください。</div></main>';
}

function verifyAndOpen() {
  askTemplate(DEPLOYMENT).then(function (known) { if (known) openPage(); else refuse(); }, function () {
    document.getElementById('app').innerHTML = '<main><div class="msg err">ページを準備できませんでした。電波の良いところで、もう一度お試しください。</div>' +
      '<p><button type="button" class="sub" id="verifyRetry">もう一度読み込む</button></p></main>';
    document.getElementById('verifyRetry').onclick = function () {
      document.getElementById('app').innerHTML = '<main><p class="spinner">読み込んでいます…</p></main>';
      verifyAndOpen();
    };
  });
}

if (!/^[A-Za-z0-9_-]{20,}$/.test(DEPLOYMENT)) {
  document.getElementById('app').innerHTML = '<main><div class="msg err">リンクが正しくありません。案内されたリンクをもう一度開いてください。</div></main>';
} else if (KNOWN_DEPLOYMENTS.indexOf(DEPLOYMENT) >= 0) {
  openPage();
} else {
  verifyAndOpen();   // a copy registered after this page was built: the template vouches for it
}
