<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>実験の日程調整</title>
<style>
  /* form-style look: lavender page, white question cards, underlined inputs, purple accent */
  :root {
    --bg: #f0ebf8; --card: #ffffff; --text: #202124; --muted: #5f6368; --line: #dadce0;
    --accent: #673ab7; --accent-weak: #ede7f6; --accent-line: #d1c4e9;
    --ok: #188038; --warn: #b06000; --warn-weak: #fef7e0; --err: #d93025; --err-weak: #fce8e6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: Roboto, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", -apple-system, sans-serif;
    font-size: 16px; line-height: 1.6; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 12px 32px; }
  h1 { font-size: 1.75rem; font-weight: 400; line-height: 1.35; margin: 0 0 8px; }
  h2 { font-size: 1rem; font-weight: 500; margin: 0 0 10px; }
  .meta { color: var(--text); font-size: .9rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 22px 24px; margin-bottom: 12px; }
  .form-head { border-top: 10px solid var(--accent); padding-top: 20px; }
  .req-note { color: var(--err); font-size: .85rem; margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
  .q-title { display: block; font-size: 1rem; font-weight: 500; margin: 0 0 14px; }
  .req { color: var(--err); }
  .q-help { color: var(--muted); font-size: .85rem; margin: -8px 0 12px; }
  label { display: block; font-weight: 500; margin: 0 0 4px; }
  input[type=text], input[type=email], input[type=number], select {
    width: 100%; font-size: 16px; padding: 6px 0 5px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
    background: transparent; color: var(--text); outline: none; }
  input[type=text]:focus, input[type=email]:focus, input[type=number]:focus, select:focus { border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
  input::placeholder { color: #9aa0a6; }
  select { border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
  .check { display: flex; gap: 12px; align-items: flex-start; font-weight: 400; margin: 0; }
  .check input { width: 20px; height: 20px; margin-top: 3px; flex: none; accent-color: var(--accent); }
  button { font-size: .95rem; padding: 9px 24px; min-height: 40px; border-radius: 4px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; font-weight: 500; letter-spacing: .02em; cursor: pointer; }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button.sub { background: #fff; color: var(--accent); border-color: var(--line); }
  button.danger { background: #fff; color: var(--err); border-color: var(--line); }
  #attend button.on { box-shadow: 0 0 0 3px var(--accent-weak); font-weight: 700; }
  details.guide > summary { cursor: pointer; color: var(--accent); font-weight: 500; min-height: 32px; }
  details.guide h3 { font-size: .95rem; font-weight: 500; margin: 16px 0 4px; }
  details.guide p, details.guide li { font-size: .92rem; }
  details.guide ol, details.guide ul { padding-left: 1.3em; margin: 4px 0; }
  .emerg { border-left: 4px solid var(--err); background: var(--err-weak); padding: 10px 14px; border-radius: 4px; margin: 0 0 12px; font-size: .92rem; }
  textarea { width: 100%; font-size: 16px; padding: 8px; border: 1px solid var(--line); border-radius: 4px; font-family: inherit; min-height: 90px; }
  .late { color: var(--warn); font-weight: 500; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .submit-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
  .sending { color: var(--accent); font-size: .9rem; }
  .submit-area { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 4px 0 16px; }
  #submitBtn:disabled { background: #b39ddb; border-color: #b39ddb; opacity: .55; }
  .day { margin-top: 14px; }
  .day-title { font-weight: 500; font-size: .95rem; border-bottom: 1px solid var(--line); padding-bottom: 2px; margin-bottom: 8px; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .slot { background: #fff; color: var(--text); border: 1px solid var(--line); font-weight: 400; padding: 9px 8px; text-align: center; }
  .slot.on { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); font-weight: 500; }
  .slot small { display: block; color: var(--muted); font-weight: 400; font-size: .78rem; }
  .chosen { background: var(--accent-weak); border-radius: 4px; padding: 8px 12px; margin: 6px 0; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .chosen button { padding: 2px 12px; min-height: 44px; font-size: .85rem; white-space: nowrap; flex: none; }
  .note { color: var(--muted); font-size: .9rem; }
  .msg { border-radius: 8px; padding: 12px 14px; margin: 12px 0; white-space: pre-wrap; }
  .msg.err { background: var(--err-weak); color: var(--err); }
  .msg.warn { background: var(--warn-weak); color: var(--warn); }
  .msg.ok { background: #e6f4ea; color: var(--ok); }
  .done-title { font-size: 1.15rem; font-weight: 500; margin: 0 0 8px; }
  .badge { display: inline-block; font-size: .8rem; border-radius: 999px; padding: 0 8px; border: 1px solid var(--line); color: var(--muted); }
  .badge.rebook { border-color: var(--warn); color: var(--warn); }
  .ask { background: var(--warn-weak); border: 1px solid #f9d46c; border-radius: 8px; padding: 12px 14px; margin: 10px 0; }
  .ask p { margin: 0; font-weight: 500; }
  .tabs { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
  .tabs button { flex: 1; background: transparent; color: var(--muted); border: 0; border-bottom: 3px solid transparent; border-radius: 0;
    padding: 10px 6px; min-height: 46px; font-weight: 500; font-size: .9rem; }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs button:hover:not(.on) { background: #f8f9fa; filter: none; }
  .page-foot { text-align: center; color: var(--muted); font-size: .78rem; margin-top: 18px; }
  /* calendar picker (Picker.html) */
  .cal { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #fff; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-title { font-weight: 700; font-size: 1.05rem; }
  .cal-nav { background: #fff; color: var(--accent); border: 1px solid var(--line); width: 44px; height: 40px; min-height: 0; padding: 0; font-size: 1.4rem; line-height: 1; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-wd { text-align: center; font-size: .8rem; color: var(--muted); padding: 2px 0; }
  .cal-wd.sun, .cal-day.sun .cal-num { color: #c62828; }
  .cal-wd.sat, .cal-day.sat .cal-num { color: #1565c0; }
  .cal-day { min-height: 54px; border-radius: 6px; font-size: inherit; letter-spacing: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 4px 0; font-weight: 500; border: 1px solid transparent; background: transparent; color: var(--text); }
  .cal-day.off { opacity: .35; }
  .cal-day.blank { visibility: hidden; }
  .cal-day.open { background: var(--accent-weak); border-color: var(--accent-line); cursor: pointer; }
  .cal-day.open .cal-num { font-weight: 700; }
  .cal-day.sel { background: var(--accent); border-color: var(--accent); }
  .cal-day.sel .cal-num, .cal-day.sel .cal-cnt { color: #fff; }
  .cal-day.has-on:not(.sel) { border: 2px solid var(--accent); }
  .cal-num { font-size: 1rem; line-height: 1.2; }
  .cal-cnt { font-size: .68rem; color: var(--accent); line-height: 1.2; }
  .cal-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 8px; font-size: .78rem; color: var(--muted); }
  .cal-legend .lg { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--accent-line); background: var(--accent-weak); }
  .cal-legend .lg.sel { background: var(--accent); border-color: var(--accent); margin-left: 6px; }
  .cal-times { margin-top: 14px; }
  /* ★おすすめ: next to a booked session (first-come). Star + text, never colour alone */
  .slot.near { border: 2px solid var(--warn); }
  .slot.near.on { border-color: var(--accent); }
  .slot small.near-tag { color: var(--warn); font-weight: 700; }
  .cal-day.near:not(.sel) .cal-cnt { color: var(--warn); font-weight: 700; }
  .slot.same { border: 2px solid var(--accent); }
  .slot small.same-tag { color: var(--accent); font-weight: 700; }
  .cal-day.same:not(.sel) .cal-cnt { color: var(--accent); font-weight: 700; }
  .lg-same { color: var(--accent); font-weight: 700; margin-left: 10px; }
  .cal-legend .lg-star { color: var(--warn); font-weight: 700; margin-left: 6px; }
  /* what taking part brings (booking page) */
  .deadline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin: 14px 0 0; padding: 10px 12px;
    background: var(--accent-weak); border: 1px solid var(--accent-line); border-radius: 6px; }
  .deadline-title { font-weight: 700; color: var(--accent); }
  .deadline-when { font-weight: 700; font-size: 1.05rem; }
  .deadline-left { font-weight: 400; font-size: .9rem; color: var(--muted); margin-left: 2px; }
  .deadline-note { flex-basis: 100%; font-size: .85rem; color: var(--muted); }
  .deadline.soon { background: var(--warn-weak); border-color: #f6c26b; }
  .deadline.soon .deadline-title, .deadline.soon .deadline-left { color: var(--warn); }
  .benefits { border-left: 6px solid var(--ok); }
  .benefits h2 { margin: 0 0 8px; font-size: 1.05rem; }
  .benefits p { margin: 4px 0; }
  .benefits .benefit-item { padding-left: 1.1em; text-indent: -1.1em; }
  .benefits .benefit-item::before { content: '✓ '; color: var(--ok); font-weight: 700; }
  /* results (manage page) */
  .results { margin: 14px 0; }
  .res-item { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 10px 0; break-inside: avoid; }
  .res-name { font-weight: 700; }
  .res-value { font-size: 1.4rem; font-weight: 700; color: var(--accent); margin: 2px 0 6px; }
  .res-change { font-size: .9rem; color: var(--text); font-weight: 400; margin-left: 6px; }
  .res-hist { border-collapse: collapse; font-size: .85rem; margin: 4px 0 6px; }
  .res-hist th, .res-hist td { border: 1px solid var(--line); padding: 3px 8px; text-align: center; }
  .res-desc, .res-use { font-size: .9rem; margin: 4px 0; }
  .print-btn { margin-left: 8px; padding: 4px 12px; min-height: 0; }
  @media print {
    body { background: #fff; }
    .row, #picker, .print-btn, .page-foot, #info, #error { display: none !important; }
    .card { border: 0; padding: 0; }
  }
  /* honeypot: kept out of sight and out of the tab order */
  .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  details.wl { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 10px; }
  details.wl summary { cursor: pointer; color: var(--accent); font-weight: 500; }
  details.wl .slot small { color: var(--muted); }
  #emailHint .msg { margin-top: 8px; }
  .near-note { background: var(--warn-weak); color: var(--text); border-radius: 6px; padding: 8px 10px; font-size: .88rem; margin: 0 0 10px; }
  .cal-times .day-title { font-size: 1rem; }
  @media (max-width: 420px) { .cal { padding: 8px 6px; } .cal-grid { gap: 3px; } .cal-day { min-height: 48px; } .cal-cnt { font-size: .62rem; } }
  /* overall status (no names) */
  .st-sum { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .95rem; }
  .st-sum b { font-size: 1.15rem; color: var(--accent); }
  .st-day { margin-top: 12px; }
  .st-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .st-item { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 7px 10px;
    border-radius: 4px; border: 1px solid var(--line); font-size: .9rem; background: #fff; }
  .st-tag { font-size: .78rem; font-weight: 700; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .st-open .st-tag { color: var(--ok); background: #e9f6ec; }
  .st-full { background: #f1f3f4; }
  .st-full .st-tag { color: #fff; background: #5f6368; }
  .st-closed { opacity: .6; }
  .st-closed .st-tag { color: var(--muted); background: #f0f0f0; }
  .st-closed.st-has { opacity: 1; }
  @media (max-width: 420px) { .st-grid { grid-template-columns: repeat(2, 1fr); } .st-item { flex-direction: column; align-items: flex-start; gap: 2px; } }
  .name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  label.sub-label { font-weight: 400; font-size: .8rem; color: var(--muted); margin: 0; }
  .name-row + .name-row { margin-top: 14px; }
  .hidden { display: none; }
  /* honorarium form: search results, picked bank / branch, station chips, radio rows */
  .opt-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .opt { text-align: left; background: #fff; color: var(--text); border: 1px solid var(--line); font-weight: 400; padding: 8px 12px; }
  .opt small, .chip small { display: block; color: var(--muted); font-size: .78rem; }
  .picked { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--accent-weak); border-radius: 4px; padding: 8px 12px; margin-top: 6px; }
  .picked button { padding: 2px 12px; min-height: 44px; font-size: .85rem; flex: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
  .chip { background: #fff; color: var(--text); border: 1px solid var(--line); font-weight: 500; padding: 6px 12px; text-align: left; }
  .chip.on { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); }
  .radio-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .radio-row input[type=radio] { width: 20px; height: 20px; margin-top: 3px; flex: none; accent-color: var(--accent); }
  input[type=date], input[type=tel] { width: 100%; font-size: 16px; padding: 6px 0 5px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--text); outline: none; }
  input[type=date]:focus, input[type=tel]:focus { border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
  button:focus-visible, a:focus-visible, input[type=checkbox]:focus-visible, input[type=radio]:focus-visible, summary:focus-visible { outline: 3px solid var(--accent-line); outline-offset: 2px; }
  .submit-note { flex-basis: 100%; margin: 0; }
  .prenotes { margin: 12px 0 0; font-size: .9rem; }
  .prenotes summary { cursor: pointer; color: var(--accent); min-height: 32px; }
  .prenotes p { margin: 6px 0 0; }
  .privacy { margin: 6px 0 4px; padding-left: 1.2em; font-size: .88rem; }
  .privacy li { margin: 4px 0; }
  input[type=file] { font-size: .9rem; }
  .ok-text { color: var(--ok); font-weight: 500; }
  .spinner { color: var(--muted); padding: 12px 0; }
  a { color: var(--accent); }
  @media (max-width: 420px) { main { padding: 8px 8px 24px; } .card { padding: 18px 16px; } h1 { font-size: 1.45rem; } .slots { grid-template-columns: repeat(2, 1fr); } }
</style>
<script>
/**
 * Calendar-style slot picker shared by the booking and manage pages.
 * Month grid: days with open slots are highlighted with their count; tapping a day
 * lists that day's times underneath. Self-contained (no helpers from the pages).
 *
 * SlotPicker.render(container, slots, {
 *   isOn(slot) -> bool,          // highlighted times (selected / multi-select)
 *   onTap(slot),                 // time tapped
 *   state: {},                   // pass the same object across re-renders to keep month/day
 *   emptyText: '...',
 *   sub(slot) -> text,           // optional small line under a time (e.g. the examiner page)
 *   legend: '...',               // optional legend text for the highlighted days
 *   timesLabel: '...'            // optional heading after the day name (default 'の空き時間')
 * })
 * slots: [{id, date:'yyyy-MM-dd', startMin, endMin, remaining|null, near}]
 *   near = next to a booked session (first-come): marked ★おすすめ, and the first such day opens first
 */
var SlotPicker = (function () {
  var lastFocus = null;   // selector of the button tapped last, focused again after the redraw
  var WD = ['日', '月', '火', '水', '木', '金', '土'];

  function h(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hm(m) { return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function key(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function parts(k) { var p = k.split('-'); return { y: +p[0], m: +p[1] - 1, d: +p[2] }; }
  function dayLabel(k) {
    var p = parts(k), wd = new Date(p.y, p.m, p.d).getDay();
    return (p.m + 1) + '月' + p.d + '日（' + WD[wd] + '）';
  }

  function render(container, slots, opts) {
    opts = opts || {};
    var st = opts.state || (container._pickerState = container._pickerState || {});
    var byDay = {};
    slots.forEach(function (s) { (byDay[s.date] = byDay[s.date] || []).push(s); });
    var days = Object.keys(byDay).sort();
    if (!days.length) {
      container.innerHTML = '<p class="msg warn">' + h(opts.emptyText ||
        '選べる日時がありません。条件に合う日時が埋まっているか、締め切られました。') + '</p>';
      return;
    }
    var nearDays = days.filter(function (k) { return byDay[k].some(function (s) { return s.near; }); });
    // ◎ = the same time of day as the participant's first session (2026-10-29)
    var sameDays = days.filter(function (k) { return byDay[k].some(function (s) { return s.same; }); });
    // keep the chosen day if still available; else the day of a selected time; else the first
    // day with a recommended time; else the first open day
    if (!st.day || !byDay[st.day]) {
      var on = slots.filter(function (s) { return opts.isOn && opts.isOn(s); })[0];
      st.day = on ? on.date : (sameDays[0] || nearDays[0] || days[0]);
    }
    if (st.month == null) { var p0 = parts(st.day); st.year = p0.y; st.month = p0.m; }
    var first = parts(days[0]), last = parts(days[days.length - 1]);
    var minIdx = first.y * 12 + first.m, maxIdx = last.y * 12 + last.m;
    var curIdx = Math.min(Math.max(st.year * 12 + st.month, minIdx), maxIdx);
    st.year = Math.floor(curIdx / 12); st.month = curIdx % 12;

    var html = '<div class="cal" role="group" aria-label="日付を選ぶ">' +
      '<div class="cal-head">' +
      '<button type="button" class="cal-nav" data-nav="-1" aria-label="前の月"' + (curIdx <= minIdx ? ' disabled' : '') + '>‹</button>' +
      '<div class="cal-title">' + st.year + '年' + (st.month + 1) + '月</div>' +
      '<button type="button" class="cal-nav" data-nav="1" aria-label="次の月"' + (curIdx >= maxIdx ? ' disabled' : '') + '>›</button>' +
      '</div><div class="cal-grid">';
    WD.forEach(function (w, i) { html += '<div class="cal-wd' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') + '">' + w + '</div>'; });
    var lead = new Date(st.year, st.month, 1).getDay();
    var n = new Date(st.year, st.month + 1, 0).getDate();
    var cells = [];
    for (var b = 0; b < lead; b++) cells.push({ html: '<div class="cal-day blank"></div>', open: false });
    for (var d = 1; d <= n; d++) {
      var k = key(st.year, st.month, d);
      var list = byDay[k] || [];
      var wd = (lead + d - 1) % 7;
      var cls = 'cal-day' + (wd === 0 ? ' sun' : wd === 6 ? ' sat' : '');
      if (!list.length) { cells.push({ html: '<div class="' + cls + ' off" aria-hidden="true"><span class="cal-num">' + d + '</span></div>', open: false }); continue; }
      var picked = list.filter(function (s) { return opts.isOn && opts.isOn(s); }).length;
      var near = nearDays.indexOf(k) >= 0, same = sameDays.indexOf(k) >= 0;
      cls += ' open' + (k === st.day ? ' sel' : '') + (picked ? ' has-on' : '') + (near ? ' near' : '') + (same ? ' same' : '');
      cells.push({ open: true, html: '<button type="button" class="' + cls + '" data-day="' + k + '" aria-pressed="' + (k === st.day) + '" aria-label="' +
        h(dayLabel(k) + ' 空き' + list.length + '枠' + (same ? '・同じ時間帯あり' : '') + (near ? '・おすすめあり' : '') + (picked ? '・選択' + picked : '')) + '">' +
        '<span class="cal-num">' + d + '</span><span class="cal-cnt">' + (picked ? '✓' + picked : (same ? '◎' : '') + (near ? '★' : '') + list.length + '枠') + '</span></button>' });
    }
    // weeks before the first / after the last open day are dropped so the times stay near the top on phones
    var rows = [];
    for (var r = 0; r < cells.length; r += 7) rows.push(cells.slice(r, r + 7));
    var hasOpen = function (row) { return row.some(function (c) { return c.open; }); };
    var firstOpen = 0, lastOpen = rows.length - 1;
    while (firstOpen < lastOpen && !hasOpen(rows[firstOpen])) firstOpen++;
    while (lastOpen > firstOpen && !hasOpen(rows[lastOpen])) lastOpen--;

+ esc(p.preNotes).replace(/\\n/g, '<br>') + '<\/p><\/details>' : '') +\n    DeadlineBox.html(p.deadline);\n  $('head').innerHTML = head;\n  if (p.benefits && p.state === 'open') {\n    var lines = String(p.benefits).split('\\n');\n    $('benefits').innerHTML = '<h2>参加すると得られるもの<\/h2>' + lines.map(function (l) {\n      return /^\\s*[・\\-]/.test(l) ? '<p class=\"benefit-item\">' + esc(l.replace(/^\\s*[・\\-]\\s*/, '')) + '<\/p>' : '<p>' + esc(l) + '<\/p>';\n    }).join('');\n    show('benefits', true);\n  }\n  if (p.resultsConsent) { $('wantResultsLabel').textContent = p.resultsConsent; show('wantResultsBox', true); }\n  show('resendBox', true);\n  show('tabs', true);\n  if (p.state !== 'open') {\n    $('head').innerHTML += '<div class=\"msg warn\">' + esc(p.message) + '<\/div>';\n    return;\n  }\n  // open, but nothing to choose and no waiting list: say so instead of showing a form that cannot be sent\n  if (!p.slots.length && !(p.waitlist && p.waitlist.length)) {\n    $('head').innerHTML += '<div class=\"msg warn\">現在、予約できる日時がありません。日時が追加されることがあります。参加をご希望の方は ' + esc(p.contact) + ' へご連絡ください。<\/div>';\n    return;\n  }\n  $('head').innerHTML += '<p class=\"req-note\">* 必須の質問です<\/p>';\n  $('infoLink').innerHTML = p.infoUrl ? '<a href=\"' + esc(p.infoUrl) + '\" target=\"_blank\" rel=\"noopener\">研究の説明文<\/a>を読み、' : '';\n  $('guardianNote').textContent = p.guardianNote;\n  $('age').oninput = function () {\n    var a = Number($('age').value);\n    show('guardianBox', p.guardianAge != null && a > 0 && a < p.guardianAge);\n  };\n  show('profile', true);\n  show('choose', true);\n  show('honor', !!p.honorarium);\n  show('confirm', true);\n  ['familyName', 'givenName', 'familyKana', 'givenKana', 'email', 'email2', 'age', 'guardian', 'guardian2'].forEach(function (id) {\n    $(id).addEventListener('input', updateSubmit);\n  });\n  ['email', 'email2'].forEach(function (id) { $(id).addEventListener('blur', renderEmailHint); $(id).addEventListener('input', function () { if (!$('emailHint').classList.contains('hidden')) renderEmailHint(); }); });\n  ['guardian', 'guardian2'].forEach(function (id) { $(id).addEventListener('blur', renderGuardianHint); $(id).addEventListener('input', function () { if (!$('guardianHint').classList.contains('hidden')) renderGuardianHint(); }); });\n  if (p.eligibility && p.eligibility.length) {\n    $('eligList').innerHTML = p.eligibility.map(function (t, i) {\n      return '<label class=\"check\"><input type=\"checkbox\" data-i=\"' + i + '\"><span>' + esc(t) + '<\/span><\/label>';\n    }).join('');\n    $('eligNote').textContent = '当てはまらない項目がある場合は、予約の前に ' + p.contact + ' へご相談ください。';\n    Array.prototype.forEach.call(document.querySelectorAll('#eligList input'), function (c) { c.addEventListener('change', updateSubmit); });\n    show('eligCard', true);\n  }\n  $('consent').addEventListener('change', updateSubmit);\n  $('privacyText').innerHTML = privacyHtml(p);\n  restoreDraft();\n  var savedIds = savedChosen();   // read before startChoose(), whose first drawing saves the (empty) list\n  startChoose();\n  restoreChosen(savedIds);\n}).catch(function (e) { loadFailed($('head'), e); });\n\n// the phone's back button steps back one session instead of leaving the page; leaving with choices made asks first\n// (2026-10-27 foolproof audit: fourteen choices went without a word)\nvar popping = false;\nwindow.addEventListener('popstate', function () {\n  if (!P || P.bookingMode !== 'first' || !chosen.length || !$('done').classList.contains('hidden')) return;\n  popping = true;\n  try { chosen = chosen.slice(0, chosen.length - 1); renderSeriesStep(chosen.length); } finally { popping = false; }\n});\nwindow.addEventListener('beforeunload', function (ev) {\n  var picks = chosen.length || (prefs || []).some(function (a) { return a && a.length; });   // 希望収集 too\n  if (P && !sending && picks && $('done').classList.contains('hidden')) { ev.preventDefault(); ev.returnValue = ''; }\n});\n\n/** What is collected, for what, who sees it, where it is kept and until when (APPI Art. 21(2)). */\nfunction privacyHtml(p) {\n  var items = [\n    '<b>使う目的<\/b>：日程の調整とご連絡（メール' + (p.useLine ? '・LINE' : '') + '）' + (p.honorarium ? '、謝金のお支払いの手続き（大学の Dr.Budget）' : '') +\n      (p.returnResults ? '、測定結果のお返し（ご希望の方）' : '') + 'にだけ使います。' + (p.honorarium ? '口座などの振込の情報は、研究のデータとしては使いません。' : ''),\n    '<b>見られる人<\/b>：研究責任者と、この実験を担当する研究者。測定の担当者（検者・補助者）のカレンダーには、日時と参加者ID（番号）だけが入ります。',\n    '<b>保管と削除<\/b>：Google のスプレッドシートに保管し、' + (p.deleteOnLabel ? esc(p.deleteOnLabel) : '研究の終了後に倫理審査で定めた日') + 'に消去します（測定のデータの扱いは研究の説明文のとおりです）。'\n  ];\n  if (p.honorarium) items.push('<b>使う外部のサービス<\/b>：郵便番号から住所を出す（zipcloud）、住所から最寄駅を探す（Google の地図・HeartRails Express）、交通費の経路を調べる（Yahoo!乗換案内。駅名だけを送ります）。');\n  return '<ul class=\"privacy\">' + items.map(function (x) { return '<li>' + x + '<\/li>'; }).join('') + '<\/ul>';\n}\n\n// the honorarium fields that are not bank details are kept too (2026-10-17 audit: a reload after the camera lost them)\nvar DRAFT_FIELDS = ['familyName', 'givenName', 'familyKana', 'givenKana', 'email', 'email2', 'age', 'guardian', 'guardian2',\n  'hZip', 'hAddress', 'hPhone', 'hBirth', 'hFaculty', 'hPosition', 'hNumber', 'hStation', 'hPassFrom', 'hPassTo'];\n/**\n * Phones often reload the page after the camera or photo picker: the plain profile fields are kept for this\n * tab (sessionStorage, gone when the tab closes). Bank details and the photo are never kept.\n */\nfunction saveDraft() {\n  try {\n    var d = {};\n    DRAFT_FIELDS.forEach(function (id) { if ($(id)) d[id] = $(id).value; });\n    sessionStorage.setItem('bookingDraft', JSON.stringify(d));\n  } catch (e) { /* private mode: nothing kept */ }\n}\nfunction restoreDraft() {\n  try {\n    var d = JSON.parse(sessionStorage.getItem('bookingDraft') || '{}');\n    DRAFT_FIELDS.forEach(function (id) { if ($(id) && d[id] && !$(id).value) $(id).value = d[id]; });\n    DRAFT_FIELDS.forEach(function (id) { if ($(id)) { $(id).addEventListener('input', saveDraft); $(id).addEventListener('change', saveDraft); } });\n    if ($('age') && $('age').oninput) $('age').oninput();\n    updateSubmit();\n  } catch (e) { /* nothing kept */ }\n}\nfunction clearDraft() { try { sessionStorage.removeItem('bookingDraft'); } catch (e) { /* ignore */ } }\n\n/** A request that failed while loading: the spinner gives way to the reason and a way to try again. */\nfunction loadFailed(el, e, retry) {\n  el.innerHTML = '<div class=\"msg err\">' + esc((e && e.message) || String(e)) + '<\/div>' +\n    '<div class=\"row\"><button type=\"button\" class=\"sub\" data-retry=\"1\">もう一度読み込む<\/button><\/div>';\n  el.querySelector('[data-retry]').onclick = retry || function () { location.reload(); };\n  show(el.id, true);\n}\n\n// ---------------------------------------------------------------- choose\n\nfunction startChoose() {\n  drawSeq++;\n  chosen = []; prefs = [];\n  var n = P.labels.length;\n  if (P.bookingMode === 'preference') {\n    setChooseTitle('ご都合のよい実験参加日時（すべて選んでください）');\n    $('chooseNote').textContent = (P.closeAtLabel ? '回答期限は' + P.closeAtLabel + 'です。締め切ったあと、' : '') +\n      '選んだ候補の中から研究者が日時を決め、メールでお知らせします。候補が多いほど決まりやすくなります。';\n    prefs = P.labels.map(function () { return []; });\n    renderPreference(0);\n  } else if (P.sequenceMode === 'repeat') {\n    setChooseTitle('実験参加日時（全' + n + '回）');\n    // every session on its own calendar (2026-10-27 本人の依頼; the weekday × time chooser is gone)\n    $('chooseNote').textContent = '事前の回 → 毎週のトレーニングの回（週' + Number(P.repeat.perWeek) + '回 × ' + Number(P.repeat.weeks) + '週）→ 事後の回 の順に、カレンダーから選びます。' +\n      'そのあとの回まで続けられる日時だけが表示されます。';\n    renderSeriesStep(0);\n  } else {\n    setChooseTitle(n > 1 ? '実験参加日時（全' + n + '回）' : '実験参加日時');\n    $('chooseNote').textContent = n > 1 ? '第1回から順に選びます。2回目以降は、決められた間隔に合う日時だけが表示されます。' : '';\n    renderSeriesStep(0);\n  }\n}\n\nfunction renderChosen() {\n  renderSummary();\n  saveChosen();\n  $('chosenList').innerHTML = chosen.map(function (c, i) {\n    return '<div class=\"chosen\"><span>' + (P.labels[i] ? '<b>' + esc(P.labels[i]) + '<\/b>　' : '') + esc(c.label) + '<\/span>' +\n      '<button type=\"button\" class=\"sub\" data-i=\"' + i + '\">選び直す<\/button><\/div>';\n  }).join('');\n  Array.prototype.forEach.call(document.querySelectorAll('#chosenList button'), function (b) {\n    b.onclick = function () {\n      var i = Number(b.getAttribute('data-i'));\n      chosen = chosen.slice(0, i);\n      renderSeriesStep(i);\n    };\n  });\n}\n\n/** Step i of a single / series / repeat booking. */\nfunction renderSeriesStep(i) {\n  renderChosen();\n  var n = P.labels.length;\n  if (!popping && i > 0 && i <= n) { try { history.pushState({ seriesStep: i }, ''); } catch (e) { /* not in every frame */ } }\n  if (i >= n) { renderConfirm(); return; }\n  var title = '<p>' + (P.labels[i] ? '<b>' + esc(P.labels[i]) + '<\/b>' + trainingWeek(i) + ' の' : '') + '日時を選んでください<br><span class=\"note\">色の付いた日をタップ → 時間をタップ<\/span><\/p>';\n  var local = i === 0 ? P.slots : localOptions(i);\n  var load = local ? Promise.resolve(local) : (\n    $('picker').innerHTML = title + '<p class=\"spinner\">候補を探しています…<\/p>',\n    call('apiOptions', chosen.map(function (c) { return c.id; }), i));\n  var mine = ++drawSeq;\n  load.then(function (opts) {\n    if (mine !== drawSeq) return;\n    if (i > 0 && opts && !opts.some(function (s) { return 'same' in s; })) opts = markSameTime(opts);\n    var hint = opts.some(function (s) { return s.near; })\n      ? '<p class=\"note\">★の付いた日時があれば、ご都合が合う範囲でそちらを優先してお選びください。<\/p>' : '';\n    hint += sameTimeNote(i, opts);\n    // 事前・事後は本人だけ: the first calendar has fewer times than the rest; said, so it does not look like a fault\n    var ownerNote = i === 0 && P.firstOwnerOnly\n      ? '<p class=\"note\">最初の回（事前の測定）は研究者が担当するため、選べる日時が限られます。そのあとの毎週のトレーニングの回では、ほかの日時も選べます。<\/p>' : '';\n    $('picker').innerHTML = title + ownerNote + hint + '<div id=\"cal\"><\/div>' + (i === 0 ? waitlistHtml() : '');\n    if (i === 0) bindWaitlist();\n    SlotPicker.render($('cal'), opts, {\n      isOn: function () { return false; },\n      onTap: function (s) {\n        chosen[i] = { id: s.id, label: s.label };\n        chosen = chosen.slice(0, i + 1);\n        renderSeriesStep(i + 1);\n        window.scrollTo(0, $('choose').offsetTop);\n      }\n    });\n  }).catch(function (e) {\n    if (mine !== drawSeq) return;\n    if (/先に選んだ日時/.test((e && e.message) || '')) {\n      // an earlier choice is gone: fresh slots, back to the first session that went (the earlier ones kept)\n      fail(e);\n      var ids = chosen.map(function (c) { return c.id; });\n      call('apiGetPage').then(function (p) { P = p; renderSeriesStep(keepValidPrefix(ids)); }).catch(function () { /* the message above stays */ });\n      return;\n    }\n    loadFailed($('picker'), e, function () { renderSeriesStep(i); });\n  });\n}\n\n// ---- cancel waitlist (first-come, single session)\n\nfunction waitlistHtml() {\n  if (!P.waitlist || !P.waitlist.length) return '';\n  return '<details class=\"wl\"><summary>ご希望の日時が満席の場合（キャンセル待ち）<\/summary>' +\n    '<p class=\"note\">満席の日時にキャンセル待ちを登録できます。空きが出たらメールでお知らせします（先着順で予約していただきます）。' +\n    '上の「お名前」「ふりがな」「メールアドレス」を入れてから登録してください。<\/p>' +\n    '<div class=\"slots\" id=\"wlGrid\">' + P.waitlist.map(function (s) {\n      return '<button type=\"button\" class=\"slot\" data-id=\"' + esc(s.id) + '\">' + esc(s.label) + '<small>満席<\/small><\/button>';\n    }).join('') + '<\/div><div class=\"row\"><button type=\"button\" class=\"sub\" id=\"wlBtn\" disabled>選んだ日時のキャンセル待ちに登録<\/button><\/div><div id=\"wlMsg\"><\/div><\/details>';\n}\n\nfunction bindWaitlist() {\n  if (!$('wlGrid')) return;\n  var picked = {};\n  Array.prototype.forEach.call(document.querySelectorAll('#wlGrid .slot'), function (b) {\n    b.onclick = function () {\n      var id = b.getAttribute('data-id');\n      if (picked[id]) delete picked[id]; else picked[id] = true;\n      b.classList.toggle('on', !!picked[id]);\n      $('wlBtn').disabled = !Object.keys(picked).length;\n    };\n  });\n  $('wlBtn').onclick = function () {\n    var btn = this;\n    var need = [];\n    if (!$('familyName').value.trim() || !$('givenName').value.trim()) need.push('お名前');\n    if (!emailOk($('email').value) || !emailSame()) need.push('メールアドレス（2回）');\n    if (need.length) { $('wlMsg').innerHTML = '<div class=\"msg warn\">先に上の ' + esc(need.join('・')) + ' を入れてください。<\/div>'; return; }\n    btn.disabled = true;\n    call('apiJoinWaitlist', Object.assign({\n      familyName: $('familyName').value, givenName: $('givenName').value, familyKana: $('familyKana').value, givenKana: $('givenKana').value,\n      email: $('email').value, emailConfirm: $('email2').value, ids: Object.keys(picked)\n    }, guardFields())).then(function (r) {\n      $('wlMsg').innerHTML = '<div class=\"msg ok\">キャンセル待ちを受け付けました（' + r.items.map(esc).join('、') + '）。空きが出たらメールでお知らせします。<\/div>';\n    }).catch(function (e) { $('wlMsg').innerHTML = '<div class=\"msg err\">' + esc(e.message || e) + '<\/div>'; btn.disabled = false; });\n  };\n}\n\n/**\n * The calendar of session i worked out on the page from P.plan (every bookable slot and the rules, with the same\n * Logic.sequenceOptions as the server): no wait between sessions. null = ask the server (no plan, or a choice\n * that is not among the plan's slots).\n */\nfunction localOptions(i) {\n  if (!P.plan || typeof Logic === 'undefined') return null;\n  var byId = P.plan.byId;\n  if (!byId) {\n    byId = P.plan.byId = {};\n    P.plan.slots.forEach(function (s) { byId[s.id] = s; });\n    P.plan.canFinish = Logic.sequencePlanner(P.plan.slots, P.plan.rules, P.plan.ex || null);\n  }\n  var prefix = chosen.slice(0, i).map(function (c) { return byId[c.id]; });\n  if (prefix.some(function (s) { return !s; })) return null;\n  return Logic.sequenceOptions(P.plan.slots, P.plan.rules, P.plan.dayLeft, prefix, P.plan.canFinish, P.plan.ex || null);\n}\n\n/**\n * ◎ on the times at the same time of day as the first session chosen (設定「同じ時間帯をおすすめする幅（分）」): measured\n * values change through the day, so the participant is asked to keep to one time where they can (2026-10-29 本人の依頼).\n * The first session's start is read from its slot id (yyyymmdd-HHMM).\n */\nfunction sameTimeRef() {\n  var m = chosen[0] && String(chosen[0].id).match(/-(\\d{2})(\\d{2})$/);\n  return m ? Number(m[1]) * 60 + Number(m[2]) : NaN;\n}\nfunction markSameTime(opts) {\n  var ref = sameTimeRef(), w = Number(P.sameTimeMin) || 0;\n  if (!w || isNaN(ref)) return opts;\n  return opts.map(function (s) { return Object.assign({}, s, { same: Math.abs(s.startMin - ref) <= w }); });\n}\nfunction sameTimeNote(i, opts) {\n  var w = Number(P.sameTimeMin) || 0;\n  if (!w || P.labels.length < 2) return '';\n  if (i === 0) return '<p class=\"note\">測定の値は時間帯によって変わるため、この実験では<b>毎回できるだけ同じ時間帯<\/b>に来ていただけると助かります。続けて来やすい時間帯を選んでください。<\/p>';\n  var ref = sameTimeRef();\n  if (isNaN(ref)) return '';\n  var hm = Math.floor(ref / 60) + ':' + ('0' + ref % 60).slice(-2);\n  return '<p class=\"note\">◎の付いた時間は、最初の回（' + hm + '開始）と同じ時間帯です。測定の値は時間帯によって変わるため、ご都合が合う範囲で◎の時間を選んでください（難しい場合は、ほかの時間でも構いません）。<\/p>';\n}\n\n/**\n * Keeps the choices (ids, in session order) that the fresh page data still allows, from the first session on, and\n * returns how many: after a failed send or a reload the participant goes on from the session that went, instead of\n * choosing all fourteen again (2026-10-27 foolproof audit).\n */\nfunction keepValidPrefix(ids) {\n  var keep = [];\n  for (var i = 0; i < ids.length && i < P.labels.length; i++) {\n    chosen = keep.slice();\n    var opts = i === 0 ? P.slots : localOptions(i);\n    if (!opts) break;\n    var hit = opts.filter(function (s) { return s.id === ids[i]; })[0];\n    if (!hit) break;\n    keep.push({ id: hit.id, label: hit.label });\n  }\n  chosen = keep;\n  return keep.length;\n}\n\n/** The choices so far survive a reload of the tab (phones reload after the camera); the ids only. */\nfunction saveChosen() {\n  try { sessionStorage.setItem('bookingChosen', JSON.stringify(chosen.map(function (c) { return c.id; }))); } catch (e) { /* nothing kept */ }\n}\nfunction savedChosen() {\n  try { var ids = JSON.parse(sessionStorage.getItem('bookingChosen') || '[]'); return Array.isArray(ids) ? ids.map(String) : []; } catch (e) { return []; }\n}\nfunction restoreChosen(ids) {\n  if (!P || P.bookingMode !== 'first' || !ids || !ids.length) return;\n  var k = keepValidPrefix(ids);\n  if (k) renderSeriesStep(k);\n  else saveChosen();\n}\n\n// ---- repeat block\n\n/** 「（第2週の1回目）」 for a training session of a repeat study, '' otherwise. */\nfunction trainingWeek(i) {\n  if (P.sequenceMode !== 'repeat' || !P.repeat) return '';\n  var k = i - P.repeat.pre;\n  if (k < 0 || k >= P.repeat.perWeek * P.repeat.weeks) return '';\n  return '（第' + (Math.floor(k / P.repeat.perWeek) + 1) + '週の' + (k % P.repeat.perWeek + 1) + '回目）';\n}\n\nfunction renderPreference(i) {\n  drawSeq++;\n  var n = P.labels.length;\n  var title = '<p>' + (P.labels[i] ? '<b>' + esc(P.labels[i]) + '<\/b>：' : '') + '都合のよい日時をすべてタップ' + (n > 1 ? '（' + (i + 1) + '/' + n + '）' : '') + '<br>' +\n    '<span class=\"note\">日付をタップすると、その日の時間が出ます。いくつ選んでも構いません。<\/span><\/p>';\n  var calState = {};   // keep the shown month/day while toggling times\n  // the calendar stays on screen; the send button below takes over once every session has picks\n  $('picker').innerHTML = title + '<div id=\"cal\"><\/div><p class=\"note\" id=\"prefCount\"><\/p>' +\n    (n > 1 ? '<div class=\"row\">' + (i > 0 ? '<button type=\"button\" class=\"sub\" id=\"prevBtn\">前の回へ<\/button>' : '') +\n      (i + 1 < n ? '<button type=\"button\" id=\"nextBtn\">次の回へ<\/button>' : '') + '<\/div>' : '');\n  if ($('prevBtn')) $('prevBtn').onclick = function () { renderPreference(i - 1); };\n  if ($('nextBtn')) $('nextBtn').onclick = function () { renderPreference(i + 1); };\n  // 最初の回／最後の回を選べる期間: only the dates this session may take\n  var win = (P.windows || [])[i] || {};\n  var mineSlots = P.slots.filter(function (s) { return (!win.from || s.date >= win.from) && (!win.to || s.date <= win.to); });\n  function draw() {\n    SlotPicker.render($('cal'), mineSlots, {\n      state: calState,\n      isOn: function (s) { return prefs[i].indexOf(s.id) >= 0; },\n      onTap: function (s) {\n        var at = prefs[i].indexOf(s.id);\n        if (at >= 0) prefs[i].splice(at, 1); else prefs[i].push(s.id);\n        draw();\n      }\n    });\n    $('prefCount').textContent = '選んだ候補：' + prefs[i].length + '件';\n    if ($('nextBtn')) $('nextBtn').disabled = !prefs[i].length;\n    renderPrefList(i);\n    renderSummary();\n  }\n  draw();\n}\n\n/** With several sessions, one line per session shows how many candidates are picked and lets the\n *  participant jump back to it (single-session forms need no list: the calendar shows the ✓). */\nfunction renderPrefList(current) {\n  if (P.labels.length < 2) { $('chosenList').innerHTML = ''; return; }\n  $('chosenList').innerHTML = P.labels.map(function (l, j) {\n    return '<div class=\"chosen\"><span><b>' + esc(l) + '<\/b>　' + (prefs[j].length ? '候補' + prefs[j].length + '件' : '未選択') +\n      (j === current ? '（選択中）' : '') + '<\/span>' +\n      (j === current ? '' : '<button type=\"button\" class=\"sub\" data-j=\"' + j + '\">' + (prefs[j].length ? '変更' : '選ぶ') + '<\/button>') + '<\/div>';\n  }).join('');\n  Array.prototype.forEach.call(document.querySelectorAll('#chosenList button[data-j]'), function (b) {\n    b.onclick = function () { renderPreference(Number(b.getAttribute('data-j'))); };\n  });\n}\n\n// ---------------------------------------------------------------- confirm & submit\n\n/** Called whenever the selection changes: only the send button reacts (no summary card). */\nfunction renderSummary() {\n  updateSubmit();\n}\n\n/** All dates chosen: close the picker and bring the send card into view. */\nfunction renderConfirm() {\n  renderSummary();\n  $('picker').innerHTML = '';\n  window.scrollTo(0, $('confirm').offsetTop);\n}\n\n$('submitBtn').onc se); });\n    clearDraft();\n    chosen = [];\n    try { sessionStorage.removeItem('bookingChosen'); } catch (e2) { /* ignore */ }\n    var html = '<p class=\"done-title\">回答を記録しました<\/p>' +\n      '<div class=\"msg ok\">' + (P.bookingMode === 'preference' ? '希望を受け付けました。' + (r.deadlineLabel ? r.deadlineLabel + 'の締切のあと、' : '') + '日時が決まったらメールでお知らせします。' : '予約が確定しました。確認メールをお送りしました。') + '<\/div>' +\n      '<ul>' + r.items.map(function (x) { return '<li>' + esc(x) + '<\/li>'; }).join('') + '<\/ul>' +\n      // where the mail went, so a wrong address is seen now (2026-10-27 foolproof audit)\n      (r.email ? '<div class=\"msg warn\">確認メールの送り先：<b>' + esc(r.email) + '<\/b>' + (r.guardianEmail ? '（保護者の方：<b>' + esc(r.guardianEmail) + '<\/b>）' : '') +\n        '<br>違っている場合はメールが届きません。下の「予約の確認ページ」から取り消して、正しいアドレスでもう一度お申し込みください。<\/div>' : '') +\n      (P.honorarium ? '<p class=\"note\">謝金の振込に必要な情報も受け付けました。<\/p>' : '') +\n      '<p>予約の確認・取消・変更は、確認メールのリンクか次のページから行えます' + (P.cancelLeadHours ? '（開始の' + Number(P.cancelLeadHours) + '時間前まで）' : '') + '。<br><a href=\"' + esc(localManageUrl(r.manageUrl)) + '\">予約の確認ページ<\/a><\/p>' +\n      (P.mapUrl ? '<p><a href=\"' + esc(P.mapUrl) + '\" target=\"_blank\" rel=\"noopener\">場所の地図を開く<\/a><\/p>' : '') +\n      (P.preNotes ? '<div class=\"msg warn\"><b>測定前のお願い・持ち物<\/b><br>' + esc(P.preNotes).replace(/\\n/g, '<br>') + '<\/div>' : '') +\n      '<p class=\"note\">確認メールが数分たっても届かない場合は、迷惑メールフォルダもご確認ください。<\/p>';\n    if (r.lineCode) html += '<p class=\"msg warn\">LINEでもリマインドを受け取る場合は、' + (r.lineAddUrl ? '<a href=\"' + esc(r.lineAddUrl) + '\" target=\"_blank\" rel=\"noopener\">公式アカウントを友だち追加<\/a>し、' : '公式アカウントに') + '次のコードを送ってください：<b>' + esc(r.lineCode) + '<\/b><\/p>';\n    $('done').innerHTML = html;\n    show('done', true);\n    loadStatus();\n    window.scrollTo(0, 0);\n  }).catch(function (e) {\n    if (e && e.lost) {\n      // the request may have gone through even though the answer never came back\n      fail({ message: '通信が途中で切れました。予約が完了している場合は、確認メールが届きます。数分たっても届かない場合は、「予約済みの方」タブでリンクの再送を試してから、必要ならもう一度送信してください。' });\n      return;\n    }\n    fail(e);\n    if (/受付は終了|募集人数に達し/.test((e && e.message) || '')) {\n      ['profile', 'choose', 'honor', 'confirm', 'benefits'].forEach(function (id) { show(id, false); });\n      return;\n    }\n    // availability may have changed: reload, keep the sessions still possible, and go on from the first that went\n    if (/埋まった|締め切られ|いっぱい|担当できる人/.test(e.message || '')) {\n      var kept = prefs, keptIds = chosen.map(function (c) { return c.id; });\n      call('apiGetPage').then(function (p) {\n        P = p;\n        startChoose();\n        if (P.bookingMode === 'first' && keptIds.length) { var k = keepValidPrefix(keptIds); if (k) renderSeriesStep(k); }\n        // preference mode: keep the picks that are still open instead of starting from nothing\n        if (P.bookingMode === 'preference' && kept.length === P.labels.length) {\n          var open = {};\n          P.slots.forEach(function (s) { open[s.id] = true; });\n          prefs = kept.map(function (list) { return list.filter(function (id) { return open[id]; }); });\n          renderPreference(0);\n        }\n      });\n    }\n  });\n};\n\nfunction submitHonorOnly(btn) {\n  if (!H.addressOk) {\n    busy(true);\n    $('sendingNote').textContent = '住所を確認しています…';\n    call('apiCheckAddress', $('hZip').value, $('hAddress').value).then(function (r) {\n      busy(false);\n      $('sendingNote').textContent = '送信中です。10秒ほどかかります。画面を閉じずにお待ちください。';\n      if (!r.issues.length) { H.addressOk = true; submitHonorOnly(btn); return; }\n      askInline($('confirm'), '郵便番号・住所をご確認ください：\\n' + r.issues.join('\\n') + '\\n正しければ、このまま送信できます。', 'このまま送信', '住所を直す',\n        function () { H.addressOk = true; submitHonorOnly(btn); }, function () { $('hZip').scrollIntoView({ block: 'center', behavior: 'smooth' }); });\n    }).catch(function () { busy(false); H.addressOk = true; submitHonorOnly(btn); });\n    return;\n  }\n  busy(true);\n  call('apiSubmitHonorarium', HON_TOKEN, honorPayload()).then(function () {\n    ['honor', 'confirm'].forEach(function (id) { show(id, false); });\n    $('done').innerHTML = '<p class=\"done-title\">回答を記録しました<\/p><div class=\"msg ok\">謝金の振込に必要な情報を受け付けました。ありがとうございました。<\/div>';\n    show('done', true);\n    clearDraft();\n    window.scrollTo(0, 0);\n  }).catch(function (e) {\n    if (!(e && e.lost)) { fail(e); return; }\n    // the answer was lost: ask the server whether it arrived instead of inviting a second send\n    call('apiHonorariumForm', HON_TOKEN).then(function (d) {\n      busy(false);\n      if (d.done) {\n        ['honor', 'confirm'].forEach(function (id) { show(id, false); });\n        $('done').innerHTML = '<p class=\"done-title\">回答を記録しました<\/p><div class=\"msg ok\">通信は途中で切れましたが、謝金の振込に必要な情報は受け付けています。ありがとうございました。<\/div>';\n        show('done', true);\n        clearDraft();\n        window.scrollTo(0, 0);\n      } else fail({ message: '通信が途中で切れたため、受け付けられませんでした。もう一度送信してください。' });\n    }).catch(function () { fail(e); });\n  });\n}\n\n// ---------------------------------------------------------------- honorarium (謝金申請)\n\n/** Inline question under an element (some in-app browsers suppress window.confirm). */\nfunction askInline(anchor, text, yesLabel, noLabel, onYes, onNo) {\n  Array.prototype.forEach.call(document.querySelectorAll('.ask'), function (el) { el.remove(); });\n  var box = document.createElement('div');\n  box.className = 'ask';\n  box.innerHTML = '<p style=\"white-space:pre-wrap\">' + esc(text) + '<\/p><div class=\"row\"><button type=\"button\" class=\"yes\">' + esc(yesLabel) +\n    '<\/button><button type=\"button\" class=\"sub no\">' + esc(noLabel) + '<\/button><\/div>';\n  anchor.parentNode.insertBefore(box, anchor);\n  box.querySelector('.yes').onclick = function () { box.remove(); onYes(); };\n  box.querySelector('.no').onclick = function () { box.remove(); if (onNo) onNo(); };\n  box.scrollIntoView({ block: 'center', behavior: 'smooth' });\n}\n\nvar H = { bank: null, branch: null, branches: [], photoId: '', check: null, checking: false, zipFilled: '', stationsFor: '', unreadableIds: [] };\n/** A photo the page could not read: remembered so that one retake is asked for, then sending is allowed. */\nfunction noteUnreadable() {\n  if (H.photoId && H.check && H.check.status === 'unreadable' && H.unreadableIds.indexOf(H.photoId) < 0) H.unreadableIds.push(H.photoId);\n}\nfunction needRetake() { return !!(H.check && H.check.status === 'unreadable' && H.unreadableIds.length < 2); }\nfunction digits(v) { return String(v || '').replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/\\D/g, ''); }\nfunction toKatakanaJs(v) { return String(v || '').replace(/\\s+/g, '').replace(/[ぁ-ゖ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) + 0x60); }); }\nfunction radio(name) { var r = document.querySelector('input[name=\"' + name + '\"]:checked'); return r ? r.value : ''; }\nfunction isYucho() { return H.bank && H.bank.code === '9900'; }\n/** 楽天 → 楽天銀行, but 城南信用金庫 / 本店 / 日吉出張所 keep their own ending. */\nfunction bankLabel(name) { return /(銀行|信用金庫|信用組合|労働金庫|農業協同組合|漁業協同組合|信金|信組|労金|農協|漁協|信連|信漁連|金庫|組合)$/.test(name) ? name : name + '銀行'; }\nfunction branchLabel(name) { return /(店|出張所|営業部|支所|事務所|センター)$/.test(name) ? name : name + '支店'; }\nvar debounce = function (fn, ms) { var t = null; return function () { clearTimeout(t); t = setTimeout(fn, ms); }; };\n\nfunction ageFromBirth(b) {\n  var m = String(b || '').match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);\n  if (!m) return NaN;\n  var now = new Date(), a = now.getFullYear() - (+m[1]);\n  if (now.getMonth() + 1 < +m[2] || (now.getMonth() + 1 === +m[2] && now.getDate() < +m[3])) a--;\n  return a;\n}\n\nfunction honorMissing() {\n  var m = [];\n  if (digits($('hZip').value).length !== 7) m.push('自宅郵便番号');\n  if ($('hAddress').value.trim().length < 6 || !Logic.addressHasNumber($('hAddress').value)) m.push('自宅住所（番地まで）');\n  if (!$('hStation').value.trim()) m.push('最寄駅名（候補を押すか入力）');\n  if (!Logic.normalizePhone($('hPhone').value)) m.push('携帯番号');\n  var a = ageFromBirth($('hBirth').value);\n  if (isNaN(a)) m.push('生年月日');\n  else if (Number($('age').value) > 0 && a !== Number($('age').value)) m.push('生年月日（年齢と合いません）');\n  var aff = radio('hAff');\n  if (!aff) m.push('所属');\n  else {\n    if (!$('hFaculty').value.trim()) m.push(aff === 'external' ? '所属先' : '所属学部（研究科）');\n    if (!$('hPosition').value.trim()) m.push(aff === 'external' ? '職位' : '学年');\n    // full-width digits from a Japanese keyboard are fine (the server reads them the same way)\n    if (aff !== 'external' && !/^[0-9A-Za-z]{4,12}$/.test($('hNumber').value.normalize('NFKC').trim())) m.push('学籍番号（教職員番号）');\n  }\n  if (!H.bank) m.push('振込先の銀行');\n  else if (isYucho()) {\n    if (!Logic.yuchoToZengin($('hKigou').value, $('hBangou').value)) m.push('ゆうちょ銀行の記号・番号（番号は末尾が1）');\n    else if (digits($('hBangou').value) !== digits($('hBangou2').value)) m.push('確認用の番号（一致していません）');\n  } else {\n    if (!H.branch) m.push('振込先の支店');\n    if (!Logic.normalizeAccount($('hAccount').value)) m.push('口座番号（7桁以内の数字）');\n    else if (Logic.normalizeAccount($('hAccount').value) !== Logic.normalizeAccount($('hAccount2').value)) m.push('確認用の口座番号（一致していません）');\n  }\n  if (!H.photoId) m.push('通帳またはキャッシュカードの写真');\n  else if (H.checking) m.push('写真の照合（確認中）');\n  else if (H.check && H.check.status === 'mismatch') m.push('写真と口座番号の照合（一致していません）');\n  else if (needRetake()) m.push('通帳またはキャッシュカードの写真（読み取れなかったため撮り直してください）');\n  var pass = radio('hPass');\n  if (!pass) m.push('定期券');\n  else if (pass === 'yes' && (!$('hPassFrom').value || !$('hPassTo').value || $('hPassFrom').value > $('hPassTo').value)) m.push('定期券の期間');\n  else if (pass === 'yes' && !radio('hCover')) m.push('定期券の区間');\n  return m;\n}\n\nfunction honorPayload() {\n  return {\n    zip: $('hZip').value, address: $('hAddress').value, phone: $('hPhone').value, birth: $('hBirth').value,\n    affiliation: radio('hAff'), faculty: $('hFaculty').value, position: $('hPosition').value, number: $('hNumber').value,\n    bankCode: H.bank ? H.bank.code : '', branchCode: H.branch ? H.branch.code : '',\n    account: $('hAccount').value, account2: $('hAccount2').value,\n    kigou: $('hKigou').value, bangou: $('hBangou').value, bangou2: $('hBangou2').value,\n    photoId: H.photoId, unreadablePhotoIds: H.unreadableIds.slice(), station: $('hStation').value,\n    stationPref: Array.prototype.some.call($('hStations').querySelectorAll('.chip'), function (b) { return b.getAttribute('data-name') === $('hStation').value.trim(); }) ? (H.stationPref || '') : '',\n    pass: { has: radio('hPass') === 'yes', from: $('hPassFrom').value, to: $('hPassTo').value, covers: radio('hCover') !== 'no' }\n  };\n}\n\nfunction want() {\n  return { bankCode: H.bank ? H.bank.code : '', branchCode: H.branch ? H.branch.code : '', account: digits($('hAccount').value),\n           kigou: digits($('hKigou').value), bangou: digits($('hBangou').value) };\n}\n\nfunction showPhotoState() {\n  var el = $('hPhotoState'), c = H.check;\n  el.className = 'note';\n  if (!H.photoId) { el.textContent = ''; return; }\n  if (H.checking) { el.textContent = '写真を照合しています…'; return; }\n  if (!c || c.status === 'pending') { el.textContent = '写真を受け取りました。口座番号を入れると、写真と照合します。'; return; }\n  if (c.status === 'ok') { el.textContent = '✓ 写真の番号と入力が一致しました。'; el.className = 'note ok-text'; return; }\n  if (c.status === 'unreadable' && needRetake()) {\n    el.className = 'msg err';\n    el.textContent = '写真から数字を読み取れませんでした。銀行名・支店番号・口座番号がはっきり写るように、明るい場所で真上から撮り直して、もう一度添付してください（撮り直すまで送信できません）。';\n    return;\n  }\n  if (c.status === 'unreadable') { el.className = 'msg warn'; el.textContent = '撮り直した写真からも数字を読み取れませんでした。このまま送信できます（研究者が写真を目で確認します）。'; return; }\n  el.className = 'msg err';\n  el.textContent = '写真の' + (c.what === 'branch' ? (isYucho() ? '記号' : '支店番号') : (isYucho() ? '番号' : '口座番号')) + '（読み取り：' + c.read.join('・') +\n    '）と入力が一致しません。入力を確かめるか、数字がはっきり写った写真を選び直してください。';\n}\n\nvar recheck = debounce(function () {\n  if (!H.photoId) return;\n  H.checking = true; showPhotoState(); updateSubmit();\n  call('apiCheckBankPhoto', H.photoId, want()).then(function (c) { H.check = c; noteUnreadable(); }).catch(function () { H.check = null; })\n    .then(function () { H.checking = false; showPhotoState(); updateSubmit(); });\n}, 600);\n\nfunction renderHolder() {\n  var name = ($('familyName').value.trim() + ' ' + $('givenName').value.trim()).trim();\n  var kana = (toKatakanaJs($('familyKana').value) + ' ' + toKatakanaJs($('givenKana').value)).trim();\n  $('hHolder').textContent = name ? '口座名義：' + name + '（' + kana + '）' : '';\n}\n\nfunction pickBank(b) {\n  H.bank = b; H.branch = null; H.branches = [];\n  $('hBankList').innerHTML = '';\n  $('hBankQ').value = '';\n  show('hBankQ', false);\n  $('hBankPicked').innerHTML = '<span>' + esc(bankLabel(b.name)) + '（' + esc(b.kana) + '・' + esc(b.code) + '）<\/span><button type=\"button\" class=\"sub\" id=\"hBankChange\">変更<\/button>';\n  show('hBankPicked', true);\n  $('hBankChange').onclick = function () { H.bank = null; H.branch = null; show('hBankPicked', false); show('hBankQ', true); show('hBranchBox', false); show('hYuchoBox', false); $('hBankQ').focus(); recheck(); updateSubmit(); };\n  show('hYuchoBox', isYucho());\n  show('hBranchBox', !isYucho());\n  pickBranch(null);\n  if (!isYucho()) {\n    var loadBranches = function () {\n      $('hBranchList').innerHTML = '<p class=\"spinner\">支店の一覧を読み込んでいます…<\/p>';\n      call('apiBranches', b.code).then(function (list) { H.branches = list; $('hBranchList').innerHTML = ''; }).catch(function (e) {\n        // in place, with a way to try again (the spinner used to stay, and every search said 見つかりません)\n        $('hBranchList').innerHTML = '<p class=\"note\">支店の一覧を読み込めませんでした。' + esc((e && e.message) || '') + '<\/p><button type=\"button\" class=\"sub\" id=\"hBranchRetry\">もう一度読み込む<\/button>';\n        $('hBranchRetry').onclick = loadBranches;\n      });\n    };\n    loadBranches();\n  }\n  recheck(); updateSubmit();\n}\n\nfunction pickBranch(br) {\n  H.branch = br;\n  show('hBranchQ', !br);\n  $('hBranchList').innerHTML = '';\n  if (!br) { show('hBranchPicked', false); return; }\n  $('hBranchPicked').innerHTML = '<span>' + esc(branchLabel(br.name)) + '（' + esc(br.kana) + '・支店番号 ' + esc(br.code) + '）<\/span><button type=\"button\" class=\"sub\" id=\"hBranchChange\">変更<\/button>';\n  show('hBranchPicked', true);\n  $('hBranchChange').onclick = function () { pickBranch(null); $('hBranchQ').value = ''; $('hBranchQ').focus(); recheck(); updateSubmit(); };\n  recheck(); updateSubmit();\n}\n\nfunction optButtons(el, list, label, onPick) {\n  el.innerHTML = list.map(function (x, i) { return '<button type=\"button\" class=\"opt\" data-i=\"' + i + '\">' + label(x) + '<\/button>'; }).join('');\n  Array.prototype.forEach.call(el.querySelectorAll('.opt'), function (b) { b.onclick = function () { onPick(list[+b.getAttribute('data-i')]); }; });\n}\n\nvar BANK_SEQ = 0;\n$('hBankQ').addEventListener('input', debounce(function () {\n  var q = $('hBankQ').value.trim();\n  var seq = ++BANK_SEQ;   // an older, slower answer must not replace the list for what is typed now\n  if (!q) { $('hBankList').innerHTML = ''; return; }\n  call('apiBankSearch', q).then(function (list) {\n    if (seq !== BANK_SEQ) return;\n    if (!list.length) { $('hBankList').innerHTML = '<p class=\"note\">見つかりません。銀行名の一部をひらがなか漢字で入れてください。<\/p>'; return; }\n    optButtons($('hBankList'), list, function (b) { return esc(b.name) + '<small>' + esc(b.kana) + '・' + esc(b.code) + '<\/small>'; }, pickBank);\n  }).catch(function (e) {\n    // shown where the person is typing, not at the top of the page\n    if (seq === BANK_SEQ) $('hBankList').innerHTML = '<p class=\"note\">' + esc((e && e.message) || '検索できませんでした') + '<\/p>';\n  });\n}, 350));\n\n$('hBranchQ').addEventListener('input', function () {\n  var q = $('hBranchQ').value.trim().replace(/(支店|してん|シテン)$/, '');\n  if (!q) { $('hBranchList').innerHTML = ''; return; }\n  var k = toKatakanaJs(q), h = toHiragana(q);\n  var hit = H.branches.filter(function (b) { return b.code.indexOf(q) === 0 || b.name.indexOf(q) >= 0 || b.kana.indexOf(k) === 0 || b.hira.indexOf(h) === 0; }).slice(0, 20);\n  if (!hit.length) { $('hBranchList').innerHTML = '<p class=\"note\">見つかりません。支店名の一部か支店番号を入れてください。<\/p>'; return; }\n  optButtons($('hBranchList'), hit, function (b) { return esc(b.name) + '<small>' + esc(b.kana) + '・' + esc(b.code) + '<\/small>'; }, pickBranch);\n});\n\n$('hZip').addEventListener('input', function () {\n  var d = digits($('hZip').value);\n  if (d.length !== 7 || d === H.zipFilled) return;\n  H.zipFilled = d;\n  call('apiZipLookup', d).then(function (r) {\n    if (!r.address) return;\n    var cur = $('hAddress').value.trim();\n    // what the participant typed is never overwritten (2026-10-27 foolproof audit); only an empty field or our own fill\n    if (!cur || cur === H.autoAddress) { $('hAddress').value = r.address; H.autoAddress = r.address; }\n    $('hAddress').focus();\n    updateSubmit();\n  }).catch(function () { /* typing the address by hand still works */ });\n});\n\nvar findStations = debounce(function () {\n  var a = $('hAddress').value.trim();\n  if (a.length < 8 || a === H.stationsFor || !/[0-9０-９一二三四五六七八九十丁番]/.test(a)) return;\n  H.stationsFor = a;\n  $('hStations').innerHTML = '<p class=\"spinner\">最寄駅を探しています…<\/p>';\n  call('apiNearestStations', a).then(function (list) {\n    if (!list.length) { $('hStations').innerHTML = '<p class=\"note\">候補が見つかりませんでした。入力してください。<\/p>'; return; }\n    $('hStations').innerHTML = list.map(function (s, i) {\n      return '<button type=\"button\" class=\"chip\" data-name=\"' + esc(s.name) + '\" data-pref=\"' + esc(s.pref || '') + '\">' + esc(s.name) + '<small>' + esc(s.lines.join('・')) + '・' + esc(s.distance) + '<\/small><\/button>';\n    }).join('');\n    Array.prototype.forEach.call($('hStations').querySelectorAll('.chip'), function (b) {\n      b.onclick = function () { $('hStation').value = b.getAttribute('data-name'); H.stationPref = b.getAttribute('data-pref'); markStation(); updateSubmit(); };\n    });\n    // not filled in by itself: an unchecked first guess sent a wrong fare (2026-10-27 foolproof audit)\n    if ($('hStations').querySelector('.chip')) $('hStations').insertAdjacentHTML('afterbegin', '<p class=\"note\">最寄駅を押して選んでください（違う場合は入力してください）。<\/p>');\n    markStation(); updateSubmit();\n  }).catch(function () { $('hStations').innerHTML = ''; });\n}, 900);\nfunction markStation() {\n  Array.prototype.forEach.call($('hStations').querySelectorAll('.chip'), function (b) { b.classList.toggle('on', b.getAttribute('data-name') === $('hStation').value.trim()); });\n}\n$('hAddress').addEventListener('input', findStations);\n['hZip', 'hAddress'].forEach(function (id) { $(id).addEventListener('input', function () { H.addressOk = false; }); });\n$('hAddress').addEventListener('blur', findStations);\n$('hStation').addEventListener('input', markStation);\n\n$('hPhone').addEventListener('blur', function () {\n  var d = digits($('hPhone').value);\n  if (/^0[789]0\\d{8}$/.test(d)) $('hPhone').value = d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);\n  updateSubmit();\n});\n$('hZip').addEventListener('blur', function () {\n  var d = digits($('hZip').value);\n  if (d.length === 7) $('hZip').value = d.slice(0, 3) + '-' + d.slice(3);\n});\n$('hBirth').addEventListener('change', function () {\n  var a = ageFromBirth($('hBirth').value), typed = Number($('age').value);\n  $('hBirthNote').textContent = isNaN(a) ? '' : (typed > 0 && typed !== a ? '生年月日からは ' + a + '歳です。上の年齢と合っていません。' : '');\n  updateSubmit();\n});\n\nArray.prototype.forEach.call(document.querySelectorAll('input[name=\"hAff\"]'), function (r) {\n  r.addEventListener('change', function () {\n    var ext = radio('hAff') === 'external';\n    show('staffNote', radio('hAff') === 'staff');\n    $('hFacultyLabel').textContent = ext ? '所属先（会社名・学校名など）' : radio('hAff') === 'staff' ? '所属（学部・研究科・部署）' : '所属学部（または研究科）';\n    $('hPositionLabel').textContent = ext ? '職位' : radio('hAff') === 'staff' ? '職位' : '学年（大学院生は課程と学年）';\n    $('hNumberLabel').textContent = radio('hAff') === 'staff' ? '教職員番号' : '学籍番号';\n    show('hNumberBox', !ext);\n    show('hAffBox', true);\n    updateSubmit();\n  });\n});\nArray.prototype.forEach.call(document.querySelectorAll('input[name=\"hCover\"]'), function (r) { r.addEventListener('change', updateSubmit); });\nArray.prototype.forEach.call(document.querySelectorAll('input[name=\"hPass\"]'), function (r) {\n  r.addEventListener('change', function () { $('hCampus').textContent = (P && P.campusStation) || '日吉'; show('hPassBox', radio('hPass') === 'yes'); updateSubmit(); });\n});\n\n['hAddress', 'hStation', 'hPhone', 'hFaculty', 'hPosition', 'hNumber', 'hAccount2', 'hBangou2', 'hPassFrom', 'hPassTo'].forEach(function (id) {\n  $(id).addEventListener('input', updateSubmit);\n});\n['hAccount', 'hKigou', 'hBangou'].forEach(function (id) {\n  $(id).addEventListener('input', function () {\n    if (isYucho()) {\n      var k = digits($('hKigou').value), n = digits($('hBangou').value);\n      $('hYuchoNote').textContent = /^1\\d{3}0$/.test(k) && /^\\d{2,8}$/.test(n) && ('00000000' + n).slice(-1) === '1'\n        ? '振込用：店名 ' + k.charAt(1) + k.charAt(2) + '8 ／ 口座番号 ' + ('00000000' + n).slice(-8, -1) : '';\n    }\n    recheck(); updateSubmit();\n  });\n});\n['familyName', 'givenName', 'familyKana', 'givenKana'].forEach(function (id) { $(id).addEventListener('input', renderHolder); });\n\n/** Shrink the photo on the phone (max 1600 px, JPEG) before sending it. */\nfunction shrinkPhoto(file) {\n  return new Promise(function (resolve, reject) {\n    var url = URL.createObjectURL(file);\n    var img = new Image();\n    img.onload = function () {\n      var scale = Math.min(1, 1600 / Math.max(img.width, img.height));\n      var cv = document.createElement('canvas');\n      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);\n      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);\n      URL.revokeObjectURL(url);\n      resolve(cv.toDataURL('image/jpeg', 0.85));\n    };\n    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('この写真は読み込めません。JPEGかPNGの写真を選んでください。')); };\n    img.src = url;\n  });\n}\n$('hPhoto').addEventListener('change', function () {\n  var f = $('hPhoto').files[0];\n  if (!f) return;\n  H.photoId = ''; H.check = null; H.checking = true;\n  $('hPhotoState').className = 'note';\n  $('hPhotoState').textContent = '写真を送っています…（10秒ほど）';\n  updateSubmit();\n  shrinkPhoto(f).then(function (dataUrl) { return call('apiUploadBankPhoto', dataUrl, want()); }).then(function (r) {\n    H.photoId = r.photoId; H.check = r.check;\n    noteUnreadable();\n  }).catch(function (e) { H.photoId = ''; $('hPhoto').value = ''; $('hPhotoState').className = 'msg err'; $('hPhotoState').textContent = (e && e.message) || String(e); })\n    .then(function () {\n      H.checking = false;\n      if (H.photoId) showPhotoState();\n      updateSubmit();\n      // an unreadable photo is pointed out where the participant is looking\n      if (needRetake()) { $('hPhotoState').scrollIntoView({ block: 'center', behavior: 'smooth' }); $('hPhoto').value = ''; }\n    });\n});\n\n$('resendBtn').onclick = function () {\n  if (!emailOk($('resendEmail').value)) { $('resendMsg').innerHTML = '<div class=\"msg err\">メールアドレスの形を確認してください。<\/div>'; return; }\n  $('resendBtn').disabled = true;\n  call('apiResend', $('resendEmail').value).then(function () {\n    $('resendMsg').innerHTML = '<div class=\"msg ok\">登録があれば、そのアドレスにリンクを送りました。届かない場合は迷惑メールフォルダもご確認ください。<\/div>';\n  }).catch(fail).then(function () { $('resendBtn').disabled = false; });\n};\n");
}

function refuse() {
  // never send anything to a web app that is not one of the lab's: the link may have been made by someone else
  document.getElementById('app').innerHTML = '<main><div class="msg err">このリンクの予約ページは使えません（登録されていない実験です）。お名前などは入力せず、案内を送ってきた研究者に直接お問い合わせください。</div></main>';
}

function verifyAndOpen() {
  askTemplate(DEPLOYMENT).then(function (known) { if (known) openPage(); else refuse(); }, function () {
    document.getElementById('app').innerHTML = '<main><div class="msg err">ページを準備できませんでした。電波の良いところで、もう一度お試しください。</div>' +
      '<p><button type="button" class="sub" id="verifyRetry">もう一度読み込む</button></p></main>';
    document.getElementById('verifyRetry').onclick = function () {
      document.getElementById('app').innerHTML = '<main><p class="spinner">読み込んでいます…</p></main>';
      verifyAndOpen();
    };
  });
}

if (!/^[A-Za-z0-9_-]{20,}$/.test(DEPLOYMENT)) {
  document.getElementById('app').innerHTML = '<main><div class="msg err">リンクが正しくありません。案内されたリンクをもう一度開いてください。</div></main>';
} else if (KNOWN_DEPLOYMENTS.indexOf(DEPLOYMENT) >= 0) {
  openPage();
} else {
  verifyAndOpen();   // a copy registered after this page was built: the template vouches for it
}
</script>
